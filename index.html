<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCRM｜專案暨報修管理系統</title>
<style>
  :root{
    --tiffany:#0ABAB5; --tiffany-d:#089c98; --tiffany-l:#7fded9; --tiffany-bg:#e9f8f7;
    --ink:#213041; --muted:#6b7c8c; --line:#e2eaef; --bg:#f4f8f9; --card:#ffffff;
    --green:#2fae66; --amber:#f0a92b; --red:#e5533c; --grey:#9aa8b4;
    --shadow:0 1px 3px rgba(20,50,60,.06),0 6px 20px rgba(20,50,60,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
  header{background:linear-gradient(100deg,var(--tiffany),var(--tiffany-d));color:#fff;
    padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  header .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--tiffany);
    display:grid;place-items:center;font-weight:800;font-size:18px}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.85;margin-left:2px}
  nav{display:flex;gap:4px;background:#fff;padding:0 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20}
  nav button{border:0;background:none;padding:13px 16px;font-size:14px;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;font-weight:600}
  nav button.active{color:var(--tiffany-d);border-bottom-color:var(--tiffany)}
  main{padding:22px;max-width:1240px;margin:0 auto}
  h2{font-size:18px;margin:0 0 4px}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .n{font-size:30px;font-weight:800;line-height:1.1}
  .kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
  .kpi.g .n{color:var(--green)} .kpi.a .n{color:var(--amber)} .kpi.r .n{color:var(--red)} .kpi.t .n{color:var(--tiffany-d)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .s-green{background:#e7f6ee;color:#1c7a45} .s-green .dot{background:var(--green)}
  .s-amber{background:#fdf1dc;color:#9a6a10} .s-amber .dot{background:var(--amber)}
  .s-red{background:#fce8e4;color:#a8331f} .s-red .dot{background:var(--red)}
  .s-grey{background:#eef2f5;color:#5a6b78} .s-grey .dot{background:var(--grey)}
  .s-tiff{background:var(--tiffany-bg);color:var(--tiffany-d)} .s-tiff .dot{background:var(--tiffany)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;background:#fafcfd}
  tr.clk{cursor:pointer} tr.clk:hover{background:var(--tiffany-bg)}
  button.btn{background:var(--tiffany);color:#fff;border:0;padding:9px 16px;border-radius:9px;
    font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
  button.btn:hover{background:var(--tiffany-d)}
  button.ghost{background:#fff;color:var(--tiffany-d);border:1px solid var(--tiffany-l)}
  button.mini{padding:5px 10px;font-size:12px;border-radius:7px}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--tiffany-l);border-color:var(--tiffany)}
  label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px}
  .field{margin-bottom:12px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  /* gantt */
  .gantt{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .gtable{border-collapse:collapse;min-width:900px}
  .gtable td,.gtable th{border-bottom:1px solid #eef3f6;padding:0}
  .glabel{padding:8px 12px;font-size:13px;white-space:nowrap;border-right:1px solid var(--line);position:sticky;left:0;background:#fff;z-index:2}
  .gphase{font-size:11px;color:var(--muted)}
  .gtrack{position:relative;height:38px}
  .gmonth{font-size:11px;color:var(--muted);text-align:center;border-right:1px dashed #eef3f6;padding:6px 0}
  .bar{position:absolute;height:14px;border-radius:7px;top:7px}
  .bar.plan{background:var(--tiffany-bg);border:1px solid var(--tiffany-l);top:6px;height:16px}
  .bar.actual{background:var(--tiffany);top:9px;height:10px}
  .bar.late{background:var(--red)}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.6;z-index:3}
  .modal-bg{position:fixed;inset:0;background:rgba(20,45,55,.45);display:none;z-index:50;padding:30px;overflow:auto}
  .modal-bg.on{display:block}
  .modal{background:#fff;max-width:960px;margin:0 auto;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal table input,.modal table select{padding:6px 7px;font-size:12px}
  .modal h3{margin:0 0 2px;font-size:18px}
  .x{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
  .steplist{margin-top:8px}
  .step{display:grid;grid-template-columns:20px 30px 1fr 92px 40px;gap:8px;align-items:start;
    padding:9px 6px;border-bottom:1px solid var(--line);background:#fff}
  .step select{margin-top:2px}
  .grip{cursor:grab;color:#c2cdd6;font-size:15px;text-align:center;user-select:none;line-height:1}
  .grip:active{cursor:grabbing}
  .step:hover .grip{color:var(--tiffany)}
  .step.dragging{opacity:.4}
  .step.dropbefore{box-shadow:inset 0 3px 0 var(--tiffany)}
  .step.dropafter{box-shadow:inset 0 -3px 0 var(--tiffany)}
  .step .no{min-width:24px;width:auto;height:24px;padding:0 6px;border-radius:12px;background:var(--tiffany-bg);
    color:var(--tiffany-d);display:inline-grid;place-items:center;font-size:12px;font-weight:700}
  .step.sub{background:#fbfdfd}
  .step.sub .no{background:#eef2f5;color:#5a6b78;font-size:11px}
  .step.sub .sinfo{padding-left:14px;border-left:2px solid var(--tiffany-l);margin-left:2px}
  .ctrls{display:flex;gap:3px;justify-content:flex-end}
  .ib{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;width:22px;height:24px;
    cursor:pointer;font-size:12px;line-height:1;padding:0}
  .ib:hover{border-color:var(--tiffany);color:var(--tiffany-d);background:var(--tiffany-bg)}
  .ib:disabled{opacity:.3;cursor:default}
  .ib.rm:hover{border-color:var(--red);color:#a8331f;background:#fce8e4}
  .edt{border:1px dashed transparent;border-radius:5px;padding:1px 3px;cursor:text}
  .edt:hover{border-color:var(--tiffany-l);background:var(--tiffany-bg)}
  .step .no{width:24px;height:24px;border-radius:50%;background:var(--tiffany-bg);color:var(--tiffany-d);
    display:grid;place-items:center;font-size:12px;font-weight:700}
  .step small{color:var(--muted)}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--tiffany-bg);color:var(--tiffany-d);margin-left:6px}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .sub-tabs{display:flex;gap:6px;margin:14px 0}
  .sub-tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:12px;color:var(--muted);font-family:inherit}
  .sub-tabs button.on{background:var(--tiffany);color:#fff;border-color:var(--tiffany)}
  .actitem{display:grid;grid-template-columns:24px 1fr 120px 110px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
  .hide{display:none}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:24px}
  .legend{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
  .legend i{width:22px;height:10px;border-radius:5px;display:inline-block;vertical-align:middle;margin-right:5px}
  /* 登入 / 設定 覆蓋層 */
  .auth{position:fixed;inset:0;background:linear-gradient(135deg,#e9f8f7,#f4f8f9);display:none;place-items:center;z-index:80;padding:20px}
  .auth.on{display:grid}
  .authcard{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(20,50,60,.18);padding:30px;width:100%;max-width:400px}
  .authcard h2{margin:0 0 4px;color:var(--tiffany-d)}
  .authcard .logo2{width:44px;height:44px;border-radius:12px;background:var(--tiffany);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:12px}
  .authcard .field{margin:12px 0}
  .authcard .btn{width:100%;padding:11px;margin-top:6px}
  .authmsg{font-size:13px;margin-top:10px;min-height:18px}
  .authmsg.err{color:var(--red)} .authmsg.ok{color:var(--green)}
  .authlink{color:var(--tiffany-d);cursor:pointer;font-size:13px;text-decoration:underline;background:none;border:0;padding:0}
  .userchip{margin-left:auto;display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
  .userchip .rb{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:20px;font-size:12px}
  .userchip button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px}
  .userchip button:hover{background:rgba(255,255,255,.28)}
  /* 唯讀 / 權限 */
  body.ro input:not(.allow),body.ro select:not(.allow),body.ro textarea,body.ro [contenteditable]{pointer-events:none;opacity:.9;background:#f7f9fa}
  body.ro .grip,body.ro .ib,body.ro .del,body.ro .btn.needEdit,body.ro .sub-tabs .addonly{display:none!important}
  body.nodel .del,body.nodel .ib.rm{display:none!important}
  .robar{background:#fff6e5;border:1px solid #f0d79a;color:#8a6410;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
  .cloudtag{font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px}
  .cloudtag.on{background:#e7f6ee;color:#1c7a45} .cloudtag.off{background:#eef2f5;color:#5a6b78}
  /* 統計圖 */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.charts{grid-template-columns:1fr}}
  .chartcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .chartcard h4{margin:0 0 12px;font-size:14px;color:var(--ink)}
  .hbar{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .hbar .track{background:#eef3f6;border-radius:6px;height:16px;overflow:hidden}
  .hbar .fill{height:16px;border-radius:6px;min-width:2px}
  .hbar .v{text-align:right;font-weight:700;color:var(--ink)}
  .cols{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
  .colwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
  .col{width:66%;max-width:34px;background:var(--tiffany);border-radius:6px 6px 0 0;min-height:2px;transition:height .3s}
  .colwrap small{color:var(--muted);font-size:11px}
  .colv{font-size:12px;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="logo">W</div>
  <div>
    <h1>WCRM 專案暨報修管理系統 <span class="sub">水處理 AI 導入</span></h1>
  </div>
  <div class="userchip" id="userchip" style="display:none">
    <span id="uName"></span><span class="rb" id="uRole"></span>
    <button id="logoutBtn">登出</button>
  </div>
</header>
<nav id="nav">
  <button data-tab="dash" class="active">儀表板</button>
  <button data-tab="proj">專案追蹤</button>
  <button data-tab="tick">報修工單</button>
  <button data-tab="members" id="navMembers" style="display:none">成員管理</button>
  <button data-tab="data">資料 / 設定</button>
</nav>
<main id="app"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<!-- 登入 / 設定 覆蓋層 -->
<div class="auth" id="authOverlay"><div class="authcard" id="authCard"></div></div>

<div class="foot">WCRM｜專案暨報修管理系統　·　Tiffany #0ABAB5　·　<span id="footMode">本機試用模式</span></div>

<script>
/* ============ 資料模型 ============ */
const PHASES = ["前置階段","啟動階段","規劃階段","安裝部署階段","AI訓練階段","結案階段"];
const TEMPLATE = [
  {no:1, phase:"前置階段", name:"調研及需求收斂", owner:"業務", days:7, docs:["調研表"]},
  {no:2, phase:"前置階段", name:"方案擬定及報價", owner:"業務/Presale", days:10, docs:["服務建議書","報價單"]},
  {no:3, phase:"啟動階段", name:"成立專案團隊", owner:"業務/PM", days:5, docs:["雲端共享資料夾"]},
  {no:4, phase:"啟動階段", name:"業務及 Presale 交接", owner:"業務/PM/場務", days:5, docs:["專案 PTSC"]},
  {no:5, phase:"規劃階段", name:"客戶現況訪談", owner:"PM/業務", days:7, docs:["現況訪談問卷(客戶簽回)","點位表確認文件(客戶簽回)"], sign:true},
  {no:6, phase:"規劃階段", name:"專案啟動會議", owner:"PM/業務", days:3, docs:["結案目標(簽回)","專案三表","甘特圖"], sign:true},
  {no:7, phase:"安裝部署階段", name:"感測器、設備進場及安裝", owner:"PM/場務/協力廠商", days:14, docs:["施工照片","驗收單(客戶簽回)"], sign:true},
  {no:8, phase:"安裝部署階段", name:"訊號串接部署", owner:"PM/場務/協力廠商", days:10, docs:["測試報告","Table Schema","感測器位置合理性確認"]},
  {no:9, phase:"AI訓練階段", name:"AI 模型訓練", owner:"AI小組/PM", days:14, docs:["需求模型"]},
  {no:10, phase:"AI訓練階段", name:"控制邏輯開發", owner:"AI小組/PM", days:14, docs:["控制程式"]},
  {no:11, phase:"AI訓練階段", name:"效能調校及試車", owner:"AI小組/PM/場務", days:14, docs:["調校後模型","測試報告"]},
  {no:12, phase:"結案階段", name:"結案報告製作", owner:"AI小組/PM", days:7, docs:["結案報告"]},
  {no:13, phase:"結案階段", name:"結案報告提報", owner:"PM/AI小組/業務", days:3, docs:["發票","教育訓練手冊"]},
];
const STEP_STATUS = ["未開始","進行中","待客戶簽回","已完成"];
const SEVERITY = {"緊急":4,"高":8,"一般":24,"低":72}; // SLA 小時
const TICKET_STATUS = ["新建","受理","處理中","待客戶確認","已結案"];
const CATEGORY = ["硬體/感測器","訊號/串接","AI模型/控制邏輯","現場/其他"];

/* ============ 工具 ============ */
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmt = d=> d? new Date(d).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit',timeZone:'UTC'}):"—";
const today = ()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/86400000);
const uid=()=>Math.random().toString(36).slice(2,8);
const ymd=d=>{const x=new Date(d);return ""+x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0');};
// 解析手動輸入的日期：接受 2025-11-07 / 2025/11/07 / 20251107
function parseDate(str){
  str=(str||'').trim().replace(/[.\/]/g,'-');
  if(/^\d{8}$/.test(str)) str=str.slice(0,4)+'-'+str.slice(4,6)+'-'+str.slice(6,8);
  const m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));   // UTC 零時，避免時區位移
  return isNaN(d.getTime())?null:d;
}
// 可手動輸入 + 可用日曆選：文字欄 + 小日曆鈕
function mkDateInput(iso, onset){
  const wrap=document.createElement("span");
  wrap.style.cssText="display:inline-flex;gap:4px;align-items:center;width:100%";
  const txt=document.createElement("input");
  txt.type="text"; txt.placeholder="YYYY-MM-DD"; txt.value=(iso||"").slice(0,10); txt.style.flex="1";
  const pick=document.createElement("input");
  pick.type="date"; pick.value=(iso||"").slice(0,10);
  pick.style.cssText="width:30px;min-width:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:transparent";
  pick.title="用日曆選擇";
  txt.onchange=()=>{ const d=parseDate(txt.value); if(d){ txt.value=d.toISOString().slice(0,10); pick.value=txt.value; onset(d); }
    else if(txt.value.trim()===""){ onset(null); }
    else { txt.value=(iso||"").slice(0,10); alert("日期格式請用 YYYY-MM-DD，例如 2025-11-07"); } };
  pick.onchange=()=>{ if(pick.value){ txt.value=pick.value; onset(parseDate(pick.value)); } };
  wrap.append(txt,pick); return wrap;
}
// 依模板天數權重，把 13 步驟平均分配到 開始→驗收 的時間窗內
function buildSteps(start,due){
  const total=TEMPLATE.reduce((a,t)=>a+t.days,0);
  const win=Math.max(TEMPLATE.length, dayDiff(due,start));
  let acc=0;
  return TEMPLATE.map(t=>{
    const ps=addDays(start, Math.round(acc/total*win));
    acc+=t.days;
    let pe=addDays(start, Math.round(acc/total*win)-1);
    if(pe<ps)pe=new Date(ps);
    return {id:uid(),no:t.no,phase:t.phase,name:t.name,owner:t.owner,docs:t.docs.slice(),sign:!!t.sign,
      planStart:ps.toISOString(),planEnd:pe.toISOString(),actualStart:null,actualEnd:null,status:"未開始"};
  });
}
// 保留狀態，只重算計畫時程（新的開始/驗收日）
function redistribute(p){
  const fresh=buildSteps(new Date(p.startDate),new Date(p.dueDate));
  p.steps.forEach((s,i)=>{ if(fresh[i]){s.planStart=fresh[i].planStart;s.planEnd=fresh[i].planEnd;} });
  // 若步驟數與模板不同（有增刪），依序平均重排多出/不足的部分
  if(p.steps.length!==fresh.length){
    const start=new Date(p.startDate),due=new Date(p.dueDate);
    const win=Math.max(p.steps.length, dayDiff(due,start));
    const seg=win/p.steps.length;
    p.steps.forEach((s,i)=>{ s.planStart=addDays(start,Math.round(i*seg)).toISOString();
      s.planEnd=addDays(start,Math.round((i+1)*seg)-1).toISOString(); });
  }
}
function genTicketNo(dateStr){
  const same=DB.tickets.filter(t=>t.no&&t.no.includes(dateStr)).length;
  return "RMA-"+dateStr+"-"+String(same+1).padStart(3,'0');
}
// 依 sub 旗標計算階層編號：主步驟 1,2,3…；子步驟 6.1,6.2,11.1…
function numberSteps(steps){
  let major=0,minor=0;
  steps.forEach(s=>{
    if(s.sub && major>0){ minor++; s.dispNo=major+"."+minor; }
    else { major++; minor=0; s.sub=false; s.dispNo=""+major; }
  });

async function syncAll(){

  try{
    const uid=cloud.user.id;
    const proj=DB.projects.map(p=>({id:p.id,data:p,updated_by:uid,updated_at:new Date().toISOString()}));
    const tick=DB.tickets.map(t=>({id:t.id,data:t,updated_by:uid,updated_at:new Date().toISOString()}));

    const [{data:sp},{data:st}]=await Promise.all([

    const lp=new Set(DB.projects.map(p=>p.id)), lt=new Set(DB.tickets.map(t=>t.id));

    if(dt.length) await cloud.sb.from("tickets").delete().in("id",dt);

/* ============ 狀態計算 ============ */
function stepLate(s){
  return s.status!=="已完成" && new Date(s.planEnd) < today();
}
function projHealth(p){
  const done=p.steps.filter(s=>s.status==="已完成").length;
  if(done===p.steps.length) return {k:"done",cls:"s-tiff",txt:"已結案"};
  const dueOver=p.dueDate && new Date(p.dueDate) < today();
  const late=p.steps.some(stepLate);
  if(dueOver) return {k:"delay",cls:"s-red",txt:"逾驗收日"};
  if(late) return {k:"delay",cls:"s-red",txt:"Delay"};
  const soon=p.steps.some(s=>s.status!=="已完成" && dayDiff(s.planEnd,today())>=0 && dayDiff(s.planEnd,today())<=3);
  const waitSign=p.steps.some(s=>s.status==="待客戶簽回");
  if(soon||waitSign) return {k:"risk",cls:"s-amber",txt:"注意"};
  return {k:"ok",cls:"s-green",txt:"On schedule"};
}
function projProgress(p){
  return Math.round(p.steps.filter(s=>s.status==="已完成").length/p.steps.length*100);
}
function curStep(p){ return p.steps.find(s=>s.status!=="已完成"); }
function ticketDue(t){ return addDays(t.reportedAt, 0), new Date(new Date(t.reportedAt).getTime()+SEVERITY[t.severity]*3600000); }
function ticketOverdue(t){ return t.status!=="已結案" && ticketDue(t) < new Date(); }

function ganttFor(p){
  numberSteps(p.steps);
  const wrap=el("div","gantt");
  const all=p.steps.flatMap(s=>[new Date(s.planStart),new Date(s.planEnd),s.actualEnd?new Date(s.actualEnd):null]).filter(Boolean);
  let min=new Date(Math.min(...all)),max=new Date(Math.max(...all,today()));
  min=addDays(min,-3);max=addDays(max,3);
  const totalDays=dayDiff(max,min);
  const pxPerDay=Math.max(2.4, Math.min(9, 820/totalDays));
  const W=totalDays*pxPerDay;
  const t=el("table","gtable");
  // 月標頭
  const thead=el("thead");const trh=el("tr");
  trh.append(el("th","glabel","階段 / 步驟"));
  const thTrack=el("th");thTrack.style.position="relative";
  let months="";let cursor=new Date(min);
  while(cursor<max){
    const next=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
    const span=dayDiff(next<max?next:max,cursor)*pxPerDay;
    months+=`<span style="display:inline-block;width:${span}px;" class="gmonth">${cursor.getFullYear()}/${String(cursor.getMonth()+1).padStart(2,'0')}</span>`;
    cursor=next;
  }
  thTrack.innerHTML=`<div style="width:${W}px">${months}</div>`;
  trh.append(thTrack);thead.append(trh);t.append(thead);
  const tb=el("tbody");
  p.steps.forEach(s=>{
    const tr=el("tr");
    const late=stepLate(s);
    tr.append(el("td","glabel",`<span class="gphase">${s.phase}</span><br>${s.sub?'　　':''}<b>${s.dispNo}</b> ${s.name}${s.sign?'<span class="tag">需簽回</span>':''}`));
    const td=el("td");
    const track=el("div","gtrack");track.style.width=W+"px";
    // plan bar
    const pl=el("div","bar plan");
    pl.style.left=dayDiff(s.planStart,min)*pxPerDay+"px";
    pl.style.width=Math.max(6,dayDiff(s.planEnd,s.planStart)*pxPerDay)+"px";
    pl.title=`計畫 ${fmt(s.planStart)} ~ ${fmt(s.planEnd)}`;
    track.append(pl);
    // actual/progress bar
    if(s.actualStart){
      const aEnd=s.actualEnd?new Date(s.actualEnd):today();
      const ab=el("div","bar actual"+(late?" late":""));
      ab.style.left=dayDiff(s.actualStart,min)*pxPerDay+"px";
      ab.style.width=Math.max(6,dayDiff(aEnd,s.actualStart)*pxPerDay)+"px";
      ab.title=`實際 ${fmt(s.actualStart)} ~ ${s.actualEnd?fmt(s.actualEnd):'進行中'}`;
      track.append(ab);
    }
    // today line
    const tl=el("div","today");tl.style.left=dayDiff(today(),min)*pxPerDay+"px";track.append(tl);
    td.append(track);tr.append(td);tb.append(tr);
  });
  t.append(tb);wrap.append(t);
  const lg=el("div","legend",`<span><i style="background:var(--tiffany-bg);border:1px solid var(--tiffany-l)"></i>計畫</span>
    <span><i style="background:var(--tiffany)"></i>實際/進行</span>
    <span><i style="background:var(--red)"></i>逾期</span>
    <span><i style="background:var(--red);width:2px"></i>今日</span>`);
  const box=el("div");box.append(wrap,lg);return box;
}

/* ============ 成本 / 毛利（未稅，不含 5%） ============ */
const TAX=1.05;
const EXP_CATS=["設備","人力工時","差旅費","材料","外包/協力","雜費","其他"];
const EQUIP_CATS=["設備"];                                    // 採購預算（設備）
const OPEX_CATS=["人力工時","差旅費","材料","外包/協力","雜費","其他"]; // 其他費用（專案執行費）
const EXP_COLOR=l=>({"設備":"#0ABAB5","人力工時":"#089c98","差旅費":"#f0a92b","材料":"#7fded9","外包/協力":"#7c6cc4","雜費":"#64748b","其他":"#9aa8b4"}[l]||"#64748b");
const fmtM=n=>"NT$ "+Math.round(n||0).toLocaleString("en-US");
const netOf=a=>(+a||0)/TAX;                                   // 由含稅實付換算未稅額
function marginTag(p){
  const c=projCost(p); if(c.margin==null) return '';
  const cls=c.margin>=70?"s-green":(c.margin>=55?"s-amber":"s-red");
  return `　·　<span class="badge ${cls}" style="padding:1px 8px">毛利率 ${c.margin.toFixed(2)}%</span>`;
}
function projCost(p){
  const exps=p.expenses||[];
  const spentGross=exps.reduce((a,e)=>a+(+e.amount||0),0);       // 含稅實付合計
  const spentNet=exps.reduce((a,e)=>a+netOf(e.amount),0);        // 未稅支出合計
  const revenue=+p.contractAmount||0;                            // 合約收入（未稅）
  const equipBudget=+p.equipBudget||0, opexBudget=+p.opexBudget||0;
  const equipSpentNet=exps.filter(e=>EQUIP_CATS.includes(e.category)).reduce((a,e)=>a+netOf(e.amount),0);
  const opexSpentNet =exps.filter(e=>OPEX_CATS.includes(e.category)).reduce((a,e)=>a+netOf(e.amount),0);
  const equipRemain=equipBudget-equipSpentNet, opexRemain=opexBudget-opexSpentNet;
  const gross=revenue-spentNet;
  const margin=revenue>0?(gross/revenue*100):null;               // 毛利率（未稅）
  const byCatNet={};EXP_CATS.forEach(c=>byCatNet[c]=0);
  exps.forEach(e=>{byCatNet[e.category]=(byCatNet[e.category]||0)+netOf(e.amount);});
  return {spentGross,spentNet,revenue,equipBudget,opexBudget,equipSpentNet,opexSpentNet,equipRemain,opexRemain,gross,margin,byCatNet,exps};
}

/* ===== 報修統計 ===== */
function monthKey(d){const x=new Date(d);return x.getFullYear()+"/"+String(x.getMonth()+1).padStart(2,'0');}
function ticketStats(){
  const ts=DB.tickets;
  const open=ts.filter(t=>t.status!=="已結案");
  const closed=ts.filter(t=>t.status==="已結案");
  const overdue=open.filter(ticketOverdue).length;
  // MTTR（平均處理天數）
  let mttr="—";
  const durs=closed.filter(t=>t.closedAt).map(t=>Math.max(0,dayDiff(t.closedAt,t.reportedAt)));
  if(durs.length)mttr=(durs.reduce((a,b)=>a+b,0)/durs.length).toFixed(1);
  // SLA 達成率（結案時間 <= SLA 期限）
  let slaRate="—";
  const rated=closed.filter(t=>t.closedAt);
  if(rated.length){const ok=rated.filter(t=>new Date(t.closedAt)<=ticketDue(t)).length;
    slaRate=Math.round(ok/rated.length*100)+"%";}
  const by=(key,val)=>{const m={};ts.forEach(t=>{const k=val?val(t):t[key];m[k]=(m[k]||0)+1;});return m;};
  // 近 6 個月趨勢
  const months=[];const now=today();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(monthKey(d));}
  const trend={};months.forEach(m=>trend[m]=0);
  ts.forEach(t=>{const k=monthKey(t.reportedAt);if(k in trend)trend[k]++;});
  return {total:ts.length,open:open.length,overdue,mttr,slaRate,
    status:by("status"),severity:by("severity"),category:by("category"),months,trend};
}
function hbars(title, entries, colorOf){
  const card=el("div","chartcard");card.append(el("h4",null,title));
  const max=Math.max(1,...entries.map(e=>e[1]));
  if(entries.every(e=>e[1]===0)) card.append(el("div","gphase","尚無資料"));
  entries.forEach(([label,val])=>{
    const row=el("div","hbar");
    row.innerHTML=`<div>${label}</div><div class="track"><div class="fill" style="width:${val/max*100}%;background:${colorOf(label)}"></div></div><div class="v">${Math.round(val).toLocaleString("en-US")}</div>`;
    card.append(row);
  });
  return card;
}
function colChart(title, labels, values){
  const card=el("div","chartcard");card.append(el("h4",null,title));
  const max=Math.max(1,...values);
  const box=el("div","cols");
  labels.forEach((lb,i)=>{
    const w=el("div","colwrap");
    w.innerHTML=`<div class="colv">${values[i]}</div><div class="col" style="height:${values[i]/max*100}%"></div><small>${lb}</small>`;
    box.append(w);
  });
  card.append(box);return card;
}

  const m=$("#modalBox");m.innerHTML="";
  m.append(el("button","x","×"));m.querySelector(".x").onclick=closeModal;
  m.append(el("h3",null,`${t.no}　${sevBadge(t.severity)} ${ticketOverdue(t)?'<span class="badge s-red"><span class="dot"></span>SLA 逾期</span>':''}`));
  m.append(el("div","gphase",`回報：${fmt(t.reportedAt)}　·　來源：${t.source}　·　SLA：${SEVERITY[t.severity]} 小時（應於 ${fmt(ticketDue(t))} 前回應）　·　保固內：${t.warranty?'是':'否（付費）'}`));
  const body=el("div");body.style.marginTop="10px";
  body.innerHTML=`<div class="field"><label>主旨</label><b>${t.title}</b></div>
    <div class="f2"><div class="field"><label>關聯專案</label>${p?p.name+'（'+p.customer+'）':'<span class="badge s-grey" style="padding:1px 8px">NA（不關聯）</span>'}</div>
    <div class="field"><label>設備 / 點位</label>${t.device||'—'}</div></div>
    <div class="f2"><div class="field"><label>分類</label>${t.category}</div>
    <div class="field"><label>處理人</label>${t.assignee||'—'}</div></div>`;
  m.append(body);
  const hf=el("div","field");hf.innerHTML=`<label>處理方式 / 進度記錄</label>`;
  const ta=el("textarea");ta.rows=4;ta.value=t.handling||"";ta.oninput=()=>{t.handling=ta.value;save();};
  hf.append(ta);m.append(hf);
  // 狀態流
  const sf=el("div","field");sf.innerHTML=`<label>狀態流程</label>`;
  const row=el("div","row");
  TICKET_STATUS.forEach(s=>{
    const b=el("button",(t.status===s?"btn mini":"btn ghost mini"),s);
    b.onclick=()=>{t.status=s;if(s==="已結案")t.closedAt=today().toISOString();else t.closedAt=null;save();drawTicket(t);renderTickIfActive();};
    row.append(b);
  });
  sf.append(row);m.append(sf);
  if(t.status==="已結案")m.append(el("div","badge s-tiff",`已結案　·　${fmt(t.closedAt)}　·　處理時長 ${Math.max(0,dayDiff(t.closedAt,t.reportedAt))} 天`));
  // 編輯 / 刪除
  const bar=el("div","row");bar.style.marginTop="16px";
  if(canEdit()){const eb=el("button","btn ghost mini","✎ 編輯欄位");eb.onclick=()=>openTicketForm(t);bar.append(eb);}
  if(canDelete()){const db=el("button","btn ghost mini","🗑 刪除此工單");db.style.color="#a8331f";
    db.onclick=()=>{if(confirm(`確定刪除報修單「${t.no}」？`)){DB.tickets=DB.tickets.filter(x=>x.id!==t.id);save();closeModal();}};bar.append(db);}
  m.append(bar);
}
function renderTickIfActive(){ if(TAB==="tick")renderTick(); }
function openTicketForm(t){        // t 為 null=新增，否則=編輯
  const isNew=!t;
  const m=$("#modalBox");m.innerHTML="";
  m.append(el("button","x","×"));m.querySelector(".x").onclick=closeModal;
  m.append(el("h3",null,isNew?"新增報修":"編輯報修 "+t.no));
  const title=el("input");title.value=t?.title||"";
  const projSel=el("select");
  const na=el("option",null,"NA（不關聯，已結案案件）");na.value="__NA__";projSel.append(na);
  DB.projects.forEach(pp=>{const o=el("option",null,`${pp.name}（${pp.customer}）`);o.value=pp.id;if(t&&t.projectId===pp.id)o.selected=true;projSel.append(o);});
  if(t&&!t.projectId) na.selected=true;
  const device=el("input");device.value=t?.device||"";
  const catSel=el("select");CATEGORY.forEach(c=>{const o=el("option",null,c);if(t?t.category===c:c==="硬體/感測器")o.selected=true;catSel.append(o);});
  const sevSel=el("select");["緊急","高","一般","低"].forEach(sv=>{const o=el("option",null,sv);if(t?t.severity===sv:sv==="一般")o.selected=true;sevSel.append(o);});
  const src=el("input");src.value=t?.source||"";src.placeholder="電話 / LINE / Email / 系統告警";
  const asg=el("input");asg.value=t?.assignee||"";asg.placeholder="處理人";
  const warSel=el("select");[["true","保固內"],["false","否（付費）"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;if(t?String(!!t.warranty)===v:v==="true")o.selected=true;warSel.append(o);});
  m.append(fld("報修主旨 *",title));
  const r1=el("div","f2");r1.append(fld("關聯專案",projSel),fld("設備 / 點位",device));m.append(r1);
  const r2=el("div","f3");r2.append(fld("分類",catSel),fld("分級（SLA）",sevSel),fld("保固",warSel));m.append(r2);
  const r3=el("div","f2");r3.append(fld("來源",src),fld("處理人",asg));m.append(r3);
  const bar=el("div","row");bar.style.marginTop="16px";
  const saveB=el("button","btn",isNew?"建立報修":"儲存");
  saveB.onclick=()=>{
    if(!title.value.trim()){title.focus();return;}
    const projectId=projSel.value==="__NA__"?null:projSel.value;
    if(isNew){
      DB.tickets.push({id:uid(),no:genTicketNo(ymd(today())),title:title.value.trim(),projectId,
        device:device.value.trim(),category:catSel.value,severity:sevSel.value,source:src.value.trim()||"電話",
        reportedAt:today().toISOString(),status:"新建",assignee:asg.value.trim(),handling:"",closedAt:null,warranty:warSel.value==="true"});
    }else{
      t.title=title.value.trim();t.projectId=projectId;t.device=device.value.trim();t.category=catSel.value;
      t.severity=sevSel.value;t.source=src.value.trim()||"電話";t.assignee=asg.value.trim();t.warranty=warSel.value==="true";
    }
    save();closeModal();
  };
  const cancel=el("button","btn ghost","取消");cancel.onclick=closeModal;
  bar.append(saveB,cancel);
  if(!isNew && canDelete()){
    const del=el("button","btn","刪除");del.style.cssText="background:var(--red);margin-left:auto";
    del.onclick=()=>{if(confirm(`確定刪除報修單「${t.no}」？`)){DB.tickets=DB.tickets.filter(x=>x.id!==t.id);save();closeModal();}};
    bar.append(del);
  }
  m.append(bar);openModal();
}

/* ============ 資料 / 匯出 ============ */
function renderData(){
  const app=$("#app");app.innerHTML="";
  app.append(el("h2",null,"資料 / 設定"));
  const modeTxt = cloud.on ? `雲端多人模式（已連線，登入為 ${ME.name}／${ME.role}）` : "本機試用模式（未連雲端）";
  app.append(el("div","page-sub",modeTxt));
  // 雲端連線狀態
  const cc=el("div","card");
  cc.innerHTML=`<div class="row between"><b>雲端連線</b>
    <span class="cloudtag ${cloud.on?'on':'off'}">${cloud.on?'● 已連線':'○ 未連線'}</span></div>
    <div class="gphase" style="margin-top:8px;line-height:1.8">
    ${cloud.on
      ? '資料儲存在你們的 Supabase，3-10 人可即時共用。變更會自動同步，其他人畫面約 1 秒內更新。'
      : '目前為單機。要開啟多人共用，請點下方「設定雲端連線」貼上 Supabase 資訊（建置指引另附）。'}</div>`;
  const cbtn=el("button","btn","☁ 設定雲端連線 / 登入");cbtn.style.marginTop="10px";
  cbtn.onclick=()=>screenConfig();
  cc.append(cbtn);
  if(cloud.on){ const lo=el("button","btn ghost","登出");lo.style.marginLeft="8px";
    lo.onclick=async()=>{await cloud.sb.auth.signOut();location.reload();}; cc.append(lo); }
  app.append(cc);
  const c=el("div","card");
  const exp=el("button","btn","⬇ 匯出備份 (JSON)");exp.onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="WCRM_PM備份_"+new Date().toISOString().slice(0,10)+".json";a.click();};
  const impL=el("label",null,"匯入備份：");impL.style.marginTop="14px";
  const imp=el("input");imp.type="file";imp.accept=".json";
  imp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{DB=JSON.parse(r.result);save();alert("匯入成功");render();}catch(err){alert("檔案格式錯誤");}};r.readAsText(f);};
  c.append(exp,el("div",null,"<br>"),impL,imp);
  if(!cloud.on){   // 只在單機試玩模式顯示；雲端正式環境隱藏，避免誤清共用資料
    const rst=el("button","btn ghost","↺ 重置為範例資料");rst.style.marginTop="12px";
    rst.onclick=()=>{if(confirm("確定重置？現有資料會清除")){DB=seed();save();render();}};
    c.append(el("div",null,"<br>"),rst);
  }
  app.append(c);
}

/* ============ Modal ============ */
function openModal(){$("#modalBg").classList.add("on");}
function closeModal(){$("#modalBg").classList.remove("on");render();}
$("#modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal();};

boot();
</script>
