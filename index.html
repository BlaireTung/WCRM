<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCRM｜專案暨報修管理系統</title>
<style>
  :root{
    --tiffany:#0ABAB5; --tiffany-d:#089c98; --tiffany-l:#7fded9; --tiffany-bg:#e9f8f7;
    --ink:#213041; --muted:#6b7c8c; --line:#e2eaef; --bg:#f4f8f9; --card:#ffffff;
    --green:#2fae66; --amber:#f0a92b; --red:#e5533c; --grey:#9aa8b4;
    --shadow:0 1px 3px rgba(20,50,60,.06),0 6px 20px rgba(20,50,60,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
  header{background:linear-gradient(100deg,var(--tiffany),var(--tiffany-d));color:#fff;
    padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  header .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--tiffany);
    display:grid;place-items:center;font-weight:800;font-size:18px}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.85;margin-left:2px}
  nav{display:flex;gap:4px;background:#fff;padding:0 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20}
  nav button{border:0;background:none;padding:13px 16px;font-size:14px;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;font-weight:600}
  nav button.active{color:var(--tiffany-d);border-bottom-color:var(--tiffany)}
  main{padding:22px;max-width:1240px;margin:0 auto}
  h2{font-size:18px;margin:0 0 4px}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .n{font-size:30px;font-weight:800;line-height:1.1}
  .kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
  .kpi.g .n{color:var(--green)} .kpi.a .n{color:var(--amber)} .kpi.r .n{color:var(--red)} .kpi.t .n{color:var(--tiffany-d)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .s-green{background:#e7f6ee;color:#1c7a45} .s-green .dot{background:var(--green)}
  .s-amber{background:#fdf1dc;color:#9a6a10} .s-amber .dot{background:var(--amber)}
  .s-red{background:#fce8e4;color:#a8331f} .s-red .dot{background:var(--red)}
  .s-grey{background:#eef2f5;color:#5a6b78} .s-grey .dot{background:var(--grey)}
  .s-tiff{background:var(--tiffany-bg);color:var(--tiffany-d)} .s-tiff .dot{background:var(--tiffany)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;background:#fafcfd}
  tr.clk{cursor:pointer} tr.clk:hover{background:var(--tiffany-bg)}
  button.btn{background:var(--tiffany);color:#fff;border:0;padding:9px 16px;border-radius:9px;
    font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
  button.btn:hover{background:var(--tiffany-d)}
  button.ghost{background:#fff;color:var(--tiffany-d);border:1px solid var(--tiffany-l)}
  button.mini{padding:5px 10px;font-size:12px;border-radius:7px}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--tiffany-l);border-color:var(--tiffany)}
  label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px}
  .field{margin-bottom:12px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  /* gantt */
  .gantt{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .gtable{border-collapse:collapse;min-width:900px}
  .gtable td,.gtable th{border-bottom:1px solid #eef3f6;padding:0}
  .glabel{padding:8px 12px;font-size:13px;white-space:nowrap;border-right:1px solid var(--line);position:sticky;left:0;background:#fff;z-index:2}
  .gphase{font-size:11px;color:var(--muted)}
  .gtrack{position:relative;height:38px}
  .gmonth{font-size:11px;color:var(--muted);text-align:center;border-right:1px dashed #eef3f6;padding:6px 0}
  .bar{position:absolute;height:14px;border-radius:7px;top:7px}
  .bar.plan{background:var(--tiffany-bg);border:1px solid var(--tiffany-l);top:6px;height:16px}
  .bar.actual{background:var(--tiffany);top:9px;height:10px}
  .bar.late{background:var(--red)}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.6;z-index:3}
  .modal-bg{position:fixed;inset:0;background:rgba(20,45,55,.45);display:none;z-index:50;padding:30px;overflow:auto}
  .modal-bg.on{display:block}
  .modal{background:#fff;max-width:960px;margin:0 auto;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal table input,.modal table select{padding:6px 7px;font-size:12px}
  .modal h3{margin:0 0 2px;font-size:18px}
  .x{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
  .steplist{margin-top:8px}
  .step{display:grid;grid-template-columns:20px 30px 1fr 92px 40px;gap:8px;align-items:start;
    padding:9px 6px;border-bottom:1px solid var(--line);background:#fff}
  .step select{margin-top:2px}
  .grip{cursor:grab;color:#c2cdd6;font-size:15px;text-align:center;user-select:none;line-height:1}
  .grip:active{cursor:grabbing}
  .step:hover .grip{color:var(--tiffany)}
  .step.dragging{opacity:.4}
  .step.dropbefore{box-shadow:inset 0 3px 0 var(--tiffany)}
  .step.dropafter{box-shadow:inset 0 -3px 0 var(--tiffany)}
  .step .no{min-width:24px;width:auto;height:24px;padding:0 6px;border-radius:12px;background:var(--tiffany-bg);
    color:var(--tiffany-d);display:inline-grid;place-items:center;font-size:12px;font-weight:700}
  .step.sub{background:#fbfdfd}
  .step.sub .no{background:#eef2f5;color:#5a6b78;font-size:11px}
  .step.sub .sinfo{padding-left:14px;border-left:2px solid var(--tiffany-l);margin-left:2px}
  .ctrls{display:flex;gap:3px;justify-content:flex-end}
  .ib{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;width:22px;height:24px;
    cursor:pointer;font-size:12px;line-height:1;padding:0}
  .ib:hover{border-color:var(--tiffany);color:var(--tiffany-d);background:var(--tiffany-bg)}
  .ib:disabled{opacity:.3;cursor:default}
  .ib.rm:hover{border-color:var(--red);color:#a8331f;background:#fce8e4}
  .edt{border:1px dashed transparent;border-radius:5px;padding:1px 3px;cursor:text}
  .edt:hover{border-color:var(--tiffany-l);background:var(--tiffany-bg)}
  .step .no{width:24px;height:24px;border-radius:50%;background:var(--tiffany-bg);color:var(--tiffany-d);
    display:grid;place-items:center;font-size:12px;font-weight:700}
  .step small{color:var(--muted)}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--tiffany-bg);color:var(--tiffany-d);margin-left:6px}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .sub-tabs{display:flex;gap:6px;margin:14px 0}
  .sub-tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:12px;color:var(--muted);font-family:inherit}
  .sub-tabs button.on{background:var(--tiffany);color:#fff;border-color:var(--tiffany)}
  .actitem{display:grid;grid-template-columns:24px 1fr 120px 110px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
  .hide{display:none}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:24px}
  .legend{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
  .legend i{width:22px;height:10px;border-radius:5px;display:inline-block;vertical-align:middle;margin-right:5px}
  /* 登入 / 設定 覆蓋層 */
  .auth{position:fixed;inset:0;background:linear-gradient(135deg,#e9f8f7,#f4f8f9);display:none;place-items:center;z-index:80;padding:20px}
  .auth.on{display:grid}
  .authcard{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(20,50,60,.18);padding:30px;width:100%;max-width:400px}
  .authcard h2{margin:0 0 4px;color:var(--tiffany-d)}
  .authcard .logo2{width:44px;height:44px;border-radius:12px;background:var(--tiffany);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:12px}
  .authcard .field{margin:12px 0}
  .authcard .btn{width:100%;padding:11px;margin-top:6px}
  .authmsg{font-size:13px;margin-top:10px;min-height:18px}
  .authmsg.err{color:var(--red)} .authmsg.ok{color:var(--green)}
  .authlink{color:var(--tiffany-d);cursor:pointer;font-size:13px;text-decoration:underline;background:none;border:0;padding:0}
  .userchip{margin-left:auto;display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
  .userchip .rb{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:20px;font-size:12px}
  .userchip button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px}
  .userchip button:hover{background:rgba(255,255,255,.28)}
  /* 唯讀 / 權限 */
  body.ro input:not(.allow),body.ro select:not(.allow),body.ro textarea,body.ro [contenteditable]{pointer-events:none;opacity:.9;background:#f7f9fa}
  body.ro .grip,body.ro .ib,body.ro .del,body.ro .btn.needEdit,body.ro .sub-tabs .addonly{display:none!important}
  body.nodel .del,body.nodel .ib.rm{display:none!important}
  .robar{background:#fff6e5;border:1px solid #f0d79a;color:#8a6410;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
  .cloudtag{font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px}
  .cloudtag.on{background:#e7f6ee;color:#1c7a45} .cloudtag.off{background:#eef2f5;color:#5a6b78}
  /* 統計圖 */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.charts{grid-template-columns:1fr}}
  .chartcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .chartcard h4{margin:0 0 12px;font-size:14px;color:var(--ink)}
  .hbar{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .hbar .track{background:#eef3f6;border-radius:6px;height:16px;overflow:hidden}
  .hbar .fill{height:16px;border-radius:6px;min-width:2px}
  .hbar .v{text-align:right;font-weight:700;color:var(--ink)}
  .cols{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
  .colwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
  .col{width:66%;max-width:34px;background:var(--tiffany);border-radius:6px 6px 0 0;min-height:2px;transition:height .3s}
  .colwrap small{color:var(--muted);font-size:11px}
  .colv{font-size:12px;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <div class="logo">W</div>
  <div>
    <h1>WCRM 專案暨報修管理系統 <span class="sub">水處理 AI 導入</span></h1>
  </div>
  <div class="userchip" id="userchip" style="display:none">
    <span id="uName"></span><span class="rb" id="uRole"></span>
    <button id="logoutBtn">登出</button>
  </div>
</header>
<nav id="nav">

<main id="app"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<!-- 登入 / 設定 覆蓋層 -->
<div class="auth" id="authOverlay"><div class="authcard" id="authCard"></div></div>

<div class="foot">WCRM｜專案暨報修管理系統　·　Tiffany #0ABAB5　·　<span id="footMode">本機試用模式</span></div>

<script>
/* ============ 資料模型 ============ */
const PHASES = ["前置階段","啟動階段","規劃階段","安裝部署階段","AI訓練階段","結案階段"];
const TEMPLATE = [
  {no:1, code:"1.1", phase:"前置階段", name:"調研及需求收斂", owner:"業務", days:7, docs:["調研表"]},
  {no:2, code:"1.2", phase:"前置階段", name:"方案擬定及報價", owner:"業務/Presale", days:10, docs:["服務建議書","報價單"]},
  {no:3, code:"2.1", phase:"啟動階段", name:"成立專案團隊", owner:"業務/PM", days:5, docs:["雲端共享資料夾"]},
  {no:4, code:"2.2", phase:"啟動階段", name:"業務及presale交接", owner:"業務/PM/場務", days:5, docs:["專案 PTSC"]},
  {no:5, code:"3.1", phase:"規劃階段", name:"客戶現況訪談", owner:"PM/業務", days:7, docs:["現況訪談問卷(客戶簽回)","點位表確認文件(客戶簽回)"], sign:true},
  {no:6, code:"3.2", phase:"規劃階段", name:"專案啟動會議", owner:"PM/業務", days:3, docs:["結案目標(簽回)","專案三表","甘特圖"], sign:true},
  {no:7, code:"4.1", phase:"安裝部署階段", name:"感測器、設備進場及安裝", owner:"PM/場務/協力廠商", days:14, docs:["施工照片","驗收單(客戶簽回)"], sign:true},
  {no:8, code:"4.2", phase:"安裝部署階段", name:"訊號串接部署", owner:"PM/場務/協力廠商", days:10, docs:["測試報告","Table Schema","感測器位置合理性確認"]},
  {no:9, code:"5.1", phase:"AI訓練階段", name:"AI模型訓練", owner:"AI小組/PM", days:14, docs:["需求模型"]},
  {no:10, code:"5.2", phase:"AI訓練階段", name:"控制邏輯開發", owner:"AI小組/PM", days:14, docs:["控制程式"]},
  {no:11, code:"5.3", phase:"AI訓練階段", name:"效能調校及試車", owner:"AI小組/PM/場務", days:14, docs:["調校後模型","測試報告"]},
  {no:12, code:"6.1", phase:"結案階段", name:"結案報告", owner:"AI小組/PM", days:7, docs:["結案報告"]},
  {no:13, code:"6.2", phase:"結案階段", name:"提報", owner:"PM/AI小組/業務", days:3, docs:["發票","教育訓練手冊"]},
];
const STEP_STATUS = ["未開始","進行中","待客戶簽回","已完成"];
const SEVERITY = {"緊急":4,"高":8,"一般":24,"低":72}; // SLA 小時
const TICKET_STATUS = ["新建","受理","處理中","待客戶確認","已結案"];
const CATEGORY = ["硬體/感測器","訊號/串接","AI模型/控制邏輯","現場/其他"];

/* ============ 工具 ============ */
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmt = d=> d? new Date(d).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit',timeZone:'UTC'}):"—";
const today = ()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/86400000);
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>{const x=new Date(d);return ""+x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0');};
// 解析手動輸入的日期：接受 2025-11-07 / 2025/11/07 / 20251107
function parseDate(str){
  str=(str||'').trim().replace(/[.\/]/g,'-');
  if(/^\d{8}$/.test(str)) str=str.slice(0,4)+'-'+str.slice(4,6)+'-'+str.slice(6,8);
  const m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));   // UTC 零時，避免時區位移
  return isNaN(d.getTime())?null:d;
}
// 可手動輸入 + 可用日曆選：文字欄 + 小日曆鈕
function mkDateInput(iso, onset){
  const wrap=document.createElement("span");
  wrap.style.cssText="display:inline-flex;gap:4px;align-items:center;width:100%";
  const txt=document.createElement("input");
  txt.type="text"; txt.placeholder="YYYY-MM-DD"; txt.value=(iso||"").slice(0,10); txt.style.flex="1";
  const pick=document.createElement("input");
  pick.type="date"; pick.value=(iso||"").slice(0,10);
  pick.style.cssText="width:30px;min-width:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:transparent";
  pick.title="用日曆選擇";
  txt.onchange=()=>{ const d=parseDate(txt.value); if(d){ txt.value=d.toISOString().slice(0,10); pick.value=txt.value; onset(d); }
    else if(txt.value.trim()===""){ onset(null); }
    else { txt.value=(iso||"").slice(0,10); alert("日期格式請用 YYYY-MM-DD，例如 2025-11-07"); } };
  pick.onchange=()=>{ if(pick.value){ txt.value=pick.value; onset(parseDate(pick.value)); } };
  wrap.append(txt,pick); return wrap;
}
// 依模板天數權重，把 13 步驟平均分配到 開始→驗收 的時間窗內
function buildSteps(start,due){
  const total=TEMPLATE.reduce((a,t)=>a+t.days,0);
  const win=Math.max(TEMPLATE.length, dayDiff(due,start));
  let acc=0;
  return TEMPLATE.map(t=>{
    const ps=addDays(start, Math.round(acc/total*win));
    acc+=t.days;
    let pe=addDays(start, Math.round(acc/total*win)-1);
    if(pe<ps)pe=new Date(ps);
    return {id:uid(),no:t.no,code:t.code,codeA:t.code,taskB:t.name,phase:t.phase,name:t.code+"｜"+t.name,owner:t.owner,
      deliverStd:t.docs.join("\n"),issue:"",docs:t.docs.slice(),sign:!!t.sign,
      planStart:ps.toISOString(),planEnd:pe.toISOString(),actualStart:null,actualEnd:null,status:"未開始"};
  });
}
// 保留狀態，只重算計畫時程（新的開始/驗收日）
function redistribute(p){
  const fresh=buildSteps(new Date(p.startDate),new Date(p.dueDate));
  p.steps.forEach((s,i)=>{ if(fresh[i]){s.planStart=fresh[i].planStart;s.planEnd=fresh[i].planEnd;} });
  // 若步驟數與模板不同（有增刪），依序平均重排多出/不足的部分
  if(p.steps.length!==fresh.length){
    const start=new Date(p.startDate),due=new Date(p.dueDate);
    const win=Math.max(p.steps.length, dayDiff(due,start));
    const seg=win/p.steps.length;
    p.steps.forEach((s,i)=>{ s.planStart=addDays(start,Math.round(i*seg)).toISOString();
      s.planEnd=addDays(start,Math.round((i+1)*seg)-1).toISOString(); });
  }
}
function genTicketNo(dateStr){
  const same=DB.tickets.filter(t=>t.no&&t.no.includes(dateStr)).length;
  return "RMA-"+dateStr+"-"+String(same+1).padStart(3,'0');
}
// 依 sub 旗標計算階層編號：主步驟 1,2,3…；子步驟 6.1,6.2,11.1…
function numberSteps(steps){
  let major=0,minor=0;
  steps.forEach(s=>{
    if(s.sub && major>0){ minor++; s.dispNo=major+"."+minor; }
    else { major++; minor=0; s.sub=false; s.dispNo=""+major; }
  });
}

const LOGKEY="husu_log_v1";
const LOG_KEEP_DAYS=30;                                   // 只保留近 30 天
const logCutoffISO=()=>new Date(Date.now()-LOG_KEEP_DAYS*86400000).toISOString();
function fmtLog(ts){
  try{
    const parts=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(ts));
    const g=t=>(parts.find(x=>x.type===t)||{}).value||'';
    return `${g('year')}${g('month')}${g('day')} ${g('hour')}:${g('minute')}`;
  }catch(e){ return String(ts).slice(0,16).replace('T',' '); }
}
function logAction(scope,target,action,detail){
  const user=(typeof ME!=="undefined"&&ME&&ME.name)?ME.name:'使用者';
  if(cloud.on){
    // 必須 .then() 才會真正送出請求（supabase-js 查詢是 lazy 的）
    try{
      cloud.sb.from("logs").insert({user_id:cloud.user?cloud.user.id:null,user_name:user,scope,target:target||'',action,detail:detail||''})
        .then(({error})=>{ if(error) console.warn("logAction 寫入失敗：",error.message); }, e=>{ console.warn("logAction 例外：",e); });
    }catch(e){ console.warn("logAction 例外：",e); }
  }else{
    try{ const cut=logCutoffISO(); let arr=JSON.parse(localStorage.getItem(LOGKEY)||"[]");
      arr.push({ts:new Date().toISOString(),user,scope,target:target||'',action,detail:detail||''});
      arr=arr.filter(x=>x.ts>=cut).slice(-2000);          // 清掉 30 天前的舊紀錄
      localStorage.setItem(LOGKEY,JSON.stringify(arr)); }catch(e){}
  }
}
async function loadLogs(){
  const cut=logCutoffISO();
  if(cloud.on){
    try{ const {data}=await cloud.sb.from("logs").select("*").gte("ts",cut).order("ts",{ascending:false}).limit(2000);
      return (data||[]).map(r=>({ts:r.ts,user:r.user_name,scope:r.scope,target:r.target,action:r.action,detail:r.detail})); }catch(e){ return []; }
  }
  try{ return JSON.parse(localStorage.getItem(LOGKEY)||"[]").filter(x=>x.ts>=cut).slice().reverse(); }catch(e){ return []; }
}

async function cloudLoad(){
  const [{data:pr},{data:tk}] = await Promise.all([
    cloud.sb.from("projects").select("data").order("updated_at",{ascending:true}),
    cloud.sb.from("tickets").select("data").order("updated_at",{ascending:true})
  ]);
  DB = { projects:(pr||[]).map(r=>r.data), tickets:(tk||[]).map(r=>r.data) };
}
async function syncAll(){
  if(!cloud.on) return;
  selfWrite=true;
  try{
    const uid=cloud.user.id;
    const proj=DB.projects.map(p=>({id:p.id,data:p,updated_by:uid,updated_at:new Date().toISOString()}));
    const tick=DB.tickets.map(t=>({id:t.id,data:t,updated_by:uid,updated_at:new Date().toISOString()}));
    if(proj.length) await cloud.sb.from("projects").upsert(proj);
    if(tick.length) await cloud.sb.from("tickets").upsert(tick);
    // 處理刪除：清掉雲端有、但本機已不存在的列
    const [{data:sp},{data:st}]=await Promise.all([
      cloud.sb.from("projects").select("id"), cloud.sb.from("tickets").select("id")]);
    const lp=new Set(DB.projects.map(p=>p.id)), lt=new Set(DB.tickets.map(t=>t.id));
    const dp=(sp||[]).filter(r=>!lp.has(r.id)).map(r=>r.id);
    const dt=(st||[]).filter(r=>!lt.has(r.id)).map(r=>r.id);
    if(dp.length) await cloud.sb.from("projects").delete().in("id",dp);
    if(dt.length) await cloud.sb.from("tickets").delete().in("id",dt);
  }catch(e){ console.error("同步失敗",e); }
  setTimeout(()=>selfWrite=false,600);
}

/* ============ 狀態計算 ============ */
function stepLate(s){
  return s.status!=="已完成" && new Date(s.planEnd) < today();
}
function projHealth(p){
  const done=p.steps.filter(s=>s.status==="已完成").length;
  if(done===p.steps.length) return {k:"done",cls:"s-tiff",txt:"已結案"};
  const dueOver=p.dueDate && new Date(p.dueDate) < today();
  const late=p.steps.some(stepLate);
  if(dueOver) return {k:"delay",cls:"s-red",txt:"逾驗收日"};
  if(late) return {k:"delay",cls:"s-red",txt:"Delay"};
  const soon=p.steps.some(s=>s.status!=="已完成" && dayDiff(s.planEnd,today())>=0 && dayDiff(s.planEnd,today())<=3);
  const waitSign=p.steps.some(s=>s.status==="待客戶簽回");
  if(soon||waitSign) return {k:"risk",cls:"s-amber",txt:"注意"};
  return {k:"ok",cls:"s-green",txt:"On schedule"};
}
function projProgress(p){
  return Math.round(p.steps.filter(s=>s.status==="已完成").length/p.steps.length*100);
}
function curStep(p){ return p.steps.find(s=>s.status!=="已完成"); }
function ticketDue(t){ return addDays(t.reportedAt, 0), new Date(new Date(t.reportedAt).getTime()+SEVERITY[t.severity]*3600000); }
function ticketOverdue(t){ return t.status!=="已結案" && ticketDue(t) < new Date(); }

  if(!data.session){ msg("註冊成功，請至信箱收驗證信後再登入。","ok"); return; }

async function ensureProfile(user, name){
  const { data:existing } = await cloud.sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(existing) return existing;
  // 角色由資料庫觸發器決定（第一人=admin，其餘=PM）；這裡帶預設值即可
  const row={ id:user.id, email:user.email, name:name||user.email.split("@")[0], role:"檢視者" };
  await cloud.sb.from("profiles").insert(row);
  const { data:created } = await cloud.sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  return created || row;
}
async function enterCloud(session){
  cloud.on=true; cloud.user=session.user;
  let prof=await ensureProfile(session.user, "");
  if(prof && prof.active===false){                     // 離職/停用帳號：擋登入
    await cloud.sb.auth.signOut(); cloud.on=false;
    hideAuth(); screenLogin();
    setTimeout(()=>msg("此帳號已停用（離職），如需恢復請洽管理員。","err"),50);
    return;
  }
  ME={ role:prof.role||"PM", name:prof.name||session.user.email, email:session.user.email };
  $("#uName").textContent=ME.name; $("#uRole").textContent=ME.role;
  $("#userchip").style.display=""; $("#footMode").textContent="雲端多人模式";

  try{localStorage.removeItem(KEY);}catch(e){}   // 清掉本機模式殘留的明文資料
  await cloudLoad();
  subscribeRealtime();
  render();
}

async function deleteMember(r){
  if(!confirm(`確定「徹底刪除」帳號 ${r.email}？\n此動作會移除帳號本體並釋放 Email（可重新註冊），無法復原。\n若只是要停用，請改用「標記離職」。`)) return;
  try{
    const { data, error } = await cloud.sb.functions.invoke("delete-user",{ body:{ userId:r.id } });
    if(error) throw new Error(error.message);
    if(data && data.error) throw new Error(data.error);
    logAction("帳號",r.name||r.email,"刪除","徹底刪除帳號（釋放 Email）");
    alert("已刪除。"); renderMembers();
  }catch(e){
    alert("刪除失敗："+e.message+"\n\n可能原因：尚未在 Supabase 部署 delete-user 函式。\n替代方式：到 Supabase → Authentication → Users 手動刪除該帳號。");
  }
}

      return true;

      bd.append(tr);
    });
    tb.append(bd);wrap.append(tb);
  }
  fScope.onchange=draw;fAct.onchange=draw;fKey.oninput=draw;
  draw();
}

function ganttFor(p){
  numberSteps(p.steps);
  const wrap=el("div","gantt");
  const all=p.steps.flatMap(s=>[new Date(s.planStart),new Date(s.planEnd),s.actualEnd?new Date(s.actualEnd):null]).filter(Boolean);
  let min=new Date(Math.min(...all)),max=new Date(Math.max(...all,today()));
  min=addDays(min,-3);max=addDays(max,3);
  const totalDays=dayDiff(max,min);
  const pxPerDay=Math.max(2.4, Math.min(9, 820/totalDays));
  const W=totalDays*pxPerDay;
  const t=el("table","gtable");
  // 月標頭
  const thead=el("thead");const trh=el("tr");
  trh.append(el("th","glabel","階段 / 步驟"));
  const thTrack=el("th");thTrack.style.position="relative";
  let months="";let cursor=new Date(min);
  while(cursor<max){
    const next=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
    const span=dayDiff(next<max?next:max,cursor)*pxPerDay;
    months+=`<span style="display:inline-block;width:${span}px;" class="gmonth">${cursor.getFullYear()}/${String(cursor.getMonth()+1).padStart(2,'0')}</span>`;
    cursor=next;
  }
  thTrack.innerHTML=`<div style="width:${W}px">${months}</div>`;
  trh.append(thTrack);thead.append(trh);t.append(thead);
  const tb=el("tbody");
  p.steps.forEach(s=>{
    const tr=el("tr");
    const late=stepLate(s);
    tr.append(el("td","glabel",`<span class="gphase">${s.phase}</span><br>${s.sub?'　　':''}<b>${s.dispNo}</b> ${s.name}${s.sign?'<span class="tag">需簽回</span>':''}`));
    const td=el("td");
    const track=el("div","gtrack");track.style.width=W+"px";
    // plan bar
    const pl=el("div","bar plan");
    pl.style.left=dayDiff(s.planStart,min)*pxPerDay+"px";
    pl.style.width=Math.max(6,dayDiff(s.planEnd,s.planStart)*pxPerDay)+"px";
    pl.title=`計畫 ${fmt(s.planStart)} ~ ${fmt(s.planEnd)}`;
    track.append(pl);
    // actual/progress bar
    if(s.actualStart){
      const aEnd=s.actualEnd?new Date(s.actualEnd):today();
      const ab=el("div","bar actual"+(late?" late":""));
      ab.style.left=dayDiff(s.actualStart,min)*pxPerDay+"px";
      ab.style.width=Math.max(6,dayDiff(aEnd,s.actualStart)*pxPerDay)+"px";
      ab.title=`實際 ${fmt(s.actualStart)} ~ ${s.actualEnd?fmt(s.actualEnd):'進行中'}`;
      track.append(ab);
    }
    // today line
    const tl=el("div","today");tl.style.left=dayDiff(today(),min)*pxPerDay+"px";track.append(tl);
    td.append(track);tr.append(td);tb.append(tr);
  });
  t.append(tb);wrap.append(t);
  const lg=el("div","legend",`<span><i style="background:var(--tiffany-bg);border:1px solid var(--tiffany-l)"></i>計畫</span>
    <span><i style="background:var(--tiffany)"></i>實際/進行</span>
    <span><i style="background:var(--red)"></i>逾期</span>
    <span><i style="background:var(--red);width:2px"></i>今日</span>`);
  const box=el("div");box.append(wrap,lg);return box;
}

    m.append(el("div","gphase",'※ 每天開啟此頁的「第一次」會自動從 PTSC 同步；之後若雲端有異動，請按「↻ 重新讀取」手動同步。名稱開頭的代碼(如 4.1)可直接改來移動步驟到該階段；拖曳 ⠿ 把手微調順序；交付／異常可多行輸入(Enter 換行)。六階段固定、13 步驟可移動改名。'));
    const list=el("div","steplist");
    let dragIdx=null;
    const clearMarks=()=>list.querySelectorAll(".step").forEach(x=>x.classList.remove("dropbefore","dropafter","dragging"));
    let curPhase=null, phSeq=0;
    p.steps.forEach((s,idx)=>{
      const late=stepLate(s);
      const ph=phaseOfStep(s);
      if(ph!==curPhase){ curPhase=ph; phSeq++;                 // 階段群組標題（六階段固定、不可拖曳）
        const hd=el("div","phasehdr");hd.style.cssText="display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:700";
        hd.innerHTML=`<span class="badge s-tiff" style="padding:2px 9px">${phSeq}</span><span>${esc(ph)}</span>`;
        list.append(hd);
      }
      const r=el("div","step"+(s.sub?" sub":""));
      // 拖曳把手
      const grip=el("div","grip","⠿");grip.draggable=true;grip.title="拖曳調整順序";
      grip.ondragstart=e=>{dragIdx=idx;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",String(idx));}catch(_){}r.classList.add("dragging");};
      grip.ondragend=()=>{dragIdx=null;clearMarks();};
      r.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect="move";
        const rect=r.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;
        list.querySelectorAll(".step").forEach(x=>x.classList.remove("dropbefore","dropafter"));
        r.classList.add(after?"dropafter":"dropbefore");};
      r.ondrop=e=>{e.preventDefault();if(dragIdx===null)return;
        const rect=r.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;
        let to=idx+(after?1:0);const from=dragIdx;
        const item=p.steps.splice(from,1)[0];if(from<to)to--;
        p.steps.splice(Math.max(0,Math.min(p.steps.length,to)),0,item);
        dragIdx=null;save();drawProject(p);};
      r.append(grip);
      r.append(el("div","no",s.dispNo));
      // 可編輯名稱 + 產出文件
      const info=el("div","sinfo");
      const nm=el("b","edt",s.name);nm.contentEditable=true;
      nm.onblur=()=>{ const t=nm.innerText.trim(); if(!t){ nm.textContent=s.name; return; }
        const oldCode=s.codeA||"";
        const i=t.indexOf("｜");                                   // 以「｜」切分：前＝代碼(含步驟名)、後＝執行任務
        if(i>=0){ s.codeA=t.slice(0,i).trim(); s.taskB=t.slice(i+1).trim(); }
        else { s.codeA=t; s.taskB=""; }
        s.name=(s.codeA?s.codeA+"｜":"")+(s.taskB||"");
        if((s.codeA||"")!==oldCode){ regroupSteps(p); logAction("專案",p.name,"修改",`步驟移動／改碼：${s.name}（${phaseOfStep(s)}）`); }
        save(); drawProject(p); };
      const grow=ta=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; };
      const line2=el("small");line2.style.display="block";
      line2.append(document.createTextNode(`負責：${s.owner||''}　·　交付：`));
      const delv0 = (s.deliverStd!=null) ? s.deliverStd : (s.docs||[]).join('\n');
      const delTa=el("textarea");delTa.value=delv0||"";delTa.rows=1;delTa.placeholder="（無）";
      delTa.style.cssText="width:100%;font:inherit;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:3px 6px;white-space:pre-wrap;overflow:hidden";
      delTa.oninput=()=>grow(delTa);
      delTa.onchange=()=>{ s.deliverStd=delTa.value.replace(/[ \t]+$/gm,'').trim(); s.docs=s.deliverStd?s.deliverStd.split(/\n+/).map(x=>x.trim()).filter(Boolean):[]; save(); };
      line2.append(delTa);
      // 異常／改善計畫(J)，多行
      const line3=el("small");line3.style.display="block";
      line3.append(document.createTextNode('異常／改善：'));
      const issTa=el("textarea");issTa.value=s.issue||"";issTa.rows=1;issTa.placeholder="（無）";
      issTa.style.cssText="width:100%;font:inherit;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:3px 6px;white-space:pre-wrap;overflow:hidden";
      issTa.oninput=()=>grow(issTa);
      issTa.onchange=()=>{ s.issue=issTa.value.replace(/[ \t]+$/gm,'').trim(); save(); };
      line3.append(issTa);
      setTimeout(()=>{grow(delTa);grow(issTa);},0);   // 載入後自動撐高以顯示多行
      info.append(nm);
      if(s.sign)info.insertAdjacentHTML('beforeend','<span class="tag">需客戶簽回</span>');
      if(late)info.insertAdjacentHTML('beforeend','<span class="badge s-red" style="margin-left:6px;padding:1px 7px">逾期</span>');
      info.append(el("br"),line2,line3);
      // 計畫起訖日（皆可調整）
      const planRow=el("small");planRow.style.cssText="display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap";
      planRow.append(document.createTextNode("計畫"));
      const ds=el("div");ds.style.cssText="width:150px;flex:none";ds.append(mkDateInput(s.planStart,(d)=>{ if(d){s.planStart=d.toISOString();} save();drawProject(p); }));
      const de=el("div");de.style.cssText="width:150px;flex:none";de.append(mkDateInput(s.planEnd,(d)=>{ if(d){s.planEnd=d.toISOString();} save();drawProject(p); }));
      planRow.append(ds,document.createTextNode("~"),de);
      info.append(planRow);
      r.append(info);
      const sel=el("select");STEP_STATUS.forEach(o=>{const op=el("option",null,o);if(o===s.status)op.selected=true;sel.append(op);});
      sel.onchange=()=>{if(s.status!==sel.value)logAction("專案",p.name,"修改",`步驟「${s.name}」狀態→${sel.value}`);s.status=sel.value;
        if(s.status==="已完成"&&!s.actualEnd)s.actualEnd=today().toISOString();
        if(s.status!=="已完成")s.actualEnd=null;
        if(s.status!=="未開始"&&!s.actualStart)s.actualStart=today().toISOString();
        save();drawProject(p);};
      r.append(sel);
      // 控制鈕：上移 / 下移 / 子項切換 / 刪除
      const ctr=el("div","ctrls");
      const sb=el("button","ib",s.sub?"«":"»");sb.title=s.sub?"升回主項":"設為子項(6.1)";
      sb.disabled=idx===0;sb.onclick=()=>{s.sub=!s.sub;save();drawProject(p);};
      const del=el("button","ib rm","✕");del.title="刪除";
      del.onclick=()=>{if(confirm(`刪除步驟「${s.name}」？`)){logAction("專案",p.name,"刪除",`步驟「${s.name}」`);p.steps.splice(idx,1);save();drawProject(p);}};
      ctr.append(sb,del);r.append(ctr);
      list.append(r);
    });
    m.append(list);
    const addBox=el("div","card");addBox.style.cssText="box-shadow:none;background:var(--tiffany-bg);padding:10px 12px;margin-top:10px";
    addBox.append(el("label",null,"新增步驟（填完按新增，不會跳窗；填「步驟編號」如 4.1 會插入到該階段/編號的下方）"));
    const fr=el("div");fr.style.cssText="display:flex;gap:6px;flex-wrap:wrap";
    const nCode=el("input");nCode.placeholder="步驟編號(如4.1)";nCode.style.cssText="width:120px;flex:none";
    const nName=el("input");nName.placeholder="步驟名稱";nName.style.flex="1";
    const nOwner=el("input");nOwner.placeholder="負責人";nOwner.style.cssText="width:110px;flex:none";
    fr.append(nCode,nName,nOwner);addBox.append(fr);
    const addBtn=el("button","btn mini","＋ 新增步驟");addBtn.style.marginTop="8px";
    addBtn.onclick=()=>{ if(!nName.value.trim()){nName.focus();return;}
      const code=nCode.value.trim();
      const prev=p.steps[p.steps.length-1];
      const ps=prev?addDays(prev.planEnd,1):(p.startDate?new Date(p.startDate):today());
      const ns={id:uid(),codeA:code,taskB:nName.value.trim(),phase:"其他",name:(code?code+"｜":"")+nName.value.trim(),owner:nOwner.value.trim(),
        deliverStd:"",issue:"",docs:[],sign:false,sub:false,
        planStart:ps.toISOString(),planEnd:addDays(ps,5).toISOString(),actualStart:null,actualEnd:null,status:"未開始"};
      ns.phase=phaseOfStep(ns);
      p.steps.push(ns); regroupSteps(p);                 // 依編號插入到正確位置（同編號則排在其下方）
      logAction("專案",p.name,"新增",`步驟「${ns.name}」`);
      nCode.value="";nName.value="";nOwner.value="";
      save();drawProject(p);
    };
    addBox.append(addBtn);m.append(addBox);
    if(getStepSheetId()) autoSyncSteps(p);   // 開啟步驟頁即自動從 PTSC 拉
  }
  else if(subTab==="gantt"){ m.append(ganttFor(p)); }
  else if(subTab==="cost"){ renderCostTab(m,p); }
  else {
    p.meetings.forEach(mt=>{
      if(!mt.decisions)mt.decisions=[]; if(!mt.actions)mt.actions=[];
      const c=el("div","card");c.style.boxShadow="none";c.style.background="#fafcfd";
      // 標題(可改) + 日期 + 刪除
      const hd=el("div","row between");
      const tt=el("b","edt",mt.title);tt.contentEditable=true;tt.onblur=()=>{mt.title=tt.textContent.trim()||mt.title;save();};
      const right=el("div","row");
      const db=el("div");db.style.width="150px";db.append(mkDateInput(mt.date,(d)=>{mt.date=d?d.toISOString():mt.date;save();}));
      const delM=el("button","ib rm","✕");delM.title="刪除會議";delM.onclick=()=>{if(confirm("刪除此會議記錄？")){logAction("專案",p.name,"刪除",`會議記錄「${mt.title}」`);p.meetings=p.meetings.filter(x=>x.id!==mt.id);save();drawProject(p);}};
      right.append(db,delM);hd.append(tt,right);c.append(hd);
      // 決議事項
      c.append(el("label",null,"決議事項"));
      mt.decisions.forEach((d,di)=>{
        const r=el("div","row between");r.style.padding="2px 0";
        r.append(el("div",null,"· "+d));
        const x=el("button","ib rm","✕");x.onclick=()=>{mt.decisions.splice(di,1);save();drawProject(p);};
        r.append(x);c.append(r);
      });
      const dRow=el("div","row");dRow.style.marginTop="4px";
      const dIn=el("input");dIn.placeholder="新增決議事項";dIn.style.flex="1";
      const dAdd=el("button","btn mini","＋");dAdd.onclick=()=>{if(!dIn.value.trim())return;mt.decisions.push(dIn.value.trim());save();drawProject(p);};
      dRow.append(dIn,dAdd);c.append(dRow);
      // 待追蹤事項
      c.append(el("label",null,"待追蹤事項"));
      mt.actions.forEach(a=>{
        const overdue=!a.done && new Date(a.due)<today();
        const r=el("div","row between");r.style.padding="4px 0";r.style.borderBottom="1px dashed var(--line)";
        const left=el("div","row");
        const cb=el("input");cb.type="checkbox";cb.checked=a.done;cb.style.width="auto";cb.onchange=()=>{a.done=cb.checked;save();drawProject(p);};
        left.append(cb,el("span",null,`${a.item} <small class="gphase">（${a.owner}）</small>`));
        const ra=el("div","row");
        ra.append(el("span","gphase",(a.done?"✓ 已完成":`到期 ${fmt(a.due)}`)));
        ra.append(el("span",null,overdue?'<span class="badge s-red" style="padding:1px 7px">逾期</span>':(a.done?'<span class="badge s-green" style="padding:1px 7px">結案</span>':'<span class="badge s-amber" style="padding:1px 7px">追蹤中</span>')));
        const x=el("button","ib rm","✕");x.onclick=()=>{mt.actions=mt.actions.filter(z=>z.id!==a.id);save();drawProject(p);};
        ra.append(x);r.append(left,ra);c.append(r);
      });
      const aBox=el("div","f3");aBox.style.marginTop="6px";
      const aItem=el("input");aItem.placeholder="待追蹤事項";
      const aOwner=el("input");aOwner.placeholder="負責人";
      const aDueBox=el("div");let aDue=addDays(today(),3);aDueBox.append(mkDateInput(aDue.toISOString(),(d)=>{aDue=d||addDays(today(),3);}));
      aBox.append(aItem,aOwner,aDueBox);c.append(aBox);
      const aAdd=el("button","btn mini","＋ 新增待追蹤");aAdd.style.marginTop="6px";
      aAdd.onclick=()=>{if(!aItem.value.trim()){aItem.focus();return;}mt.actions.push({id:uid(),item:aItem.value.trim(),owner:aOwner.value.trim(),due:(aDue||addDays(today(),3)).toISOString(),done:false});save();drawProject(p);};
      c.append(aAdd);
      m.append(c);
    });
    // 新增會議記錄（表單式）
    const mBox=el("div","card");mBox.style.cssText="box-shadow:none;background:var(--tiffany-bg);padding:10px 12px";
    mBox.append(el("label",null,"新增會議記錄"));
    const mr=el("div","f2");
    const mTitle=el("input");mTitle.placeholder="會議主題";
    const mDateBox=el("div");let mDate=today();mDateBox.append(mkDateInput(today().toISOString(),(d)=>{mDate=d||today();}));
    mr.append(mTitle,mDateBox);mBox.append(mr);
    const mAdd=el("button","btn mini","＋ 新增會議");mAdd.style.marginTop="8px";
    mAdd.onclick=()=>{const mtt=mTitle.value.trim()||"會議";p.meetings.push({id:uid(),date:(mDate||today()).toISOString(),title:mtt,decisions:[],actions:[]});logAction("專案",p.name,"新增",`會議記錄「${mtt}」`);save();drawProject(p);};
    mBox.append(mAdd);m.append(mBox);
  }
}
const fld=(lb,inp)=>{const d=el("div","field");d.append(el("label",null,lb));d.append(inp);return d;};
async function openProjectForm(p){        // p 為 null=新增，否則=編輯
  const isNew=!p;
  if(!isNew && !canEditProject(p)){ alert("此專案僅 admin 或負責 PM 可修改。"); return; }
  const m=$("#modalBox");m.innerHTML="";
  m.append(el("button","x","×"));m.querySelector(".x").onclick=closeModal;
  m.append(el("h3",null,isNew?"新增專案":"編輯專案"));
  const name=el("input");name.value=p?.name||"";
  const cust=el("input");cust.value=p?.customer||"";
  // PM 欄位：雲端→下拉選單（admin/PM/成員 帳號）；本機→文字輸入
  let pmField, getPm;
  if(cloud.on){
    let members=[];
    try{ const {data}=await cloud.sb.from("profiles").select("name,role").in("role",["admin","PM","成員"]).order("name");
      members=(data||[]).map(x=>x.name).filter(Boolean); }catch(e){}
    const sel=el("select");
    const blank=el("option",null,"— 請選擇 PM —");blank.value="";sel.append(blank);
    members.forEach(n=>{const o=el("option",null,n);o.value=n;if(p&&p.pm===n)o.selected=true;sel.append(o);});
    if(p&&p.pm&&!members.includes(p.pm)){const o=el("option",null,p.pm+"（不在名單）");o.value=p.pm;o.selected=true;sel.append(o);}
    pmField=sel; getPm=()=>sel.value.trim();
  }else{
    const inp=el("input");inp.value=p?.pm||"";inp.placeholder="PM 姓名";
    pmField=inp; getPm=()=>inp.value.trim();
  }
  // PM 選定後鎖定：編輯既有專案時，僅 admin 可變更 PM
  const pmLocked = (!isNew && ME.role!=="admin");
  if(pmLocked){ pmField.disabled=true; pmField.title="PM 僅 admin 可變更"; }
  let startD=p?.startDate?new Date(p.startDate):today();
  let dueD=p?.dueDate?new Date(p.dueDate):addDays(today(),90);
  const startBox=el("div");startBox.append(mkDateInput(startD.toISOString(),(d)=>{startD=d||startD;}));
  const dueBox=el("div");dueBox.append(mkDateInput(dueD.toISOString(),(d)=>{dueD=d||dueD;}));
  m.append(fld("專案名稱 ✱（必填）",name));
  const r=el("div","f2");r.append(fld("客戶",cust),fld(pmLocked?"PM（僅 admin 可變更）":"PM ✱（必填）",pmField));m.append(r);
  const r2=el("div","f2");r2.append(fld("專案開始日",startBox),fld("驗收日（結束）",dueBox));m.append(r2);
  // PTSC 雲端分頁名稱（步驟同步用；留空則用專案名稱去找）
  const ptscIn=el("input");ptscIn.value=p?.ptscTab||"";ptscIn.placeholder="此案在 PTSC 步驟表的分頁名（例：聯電4）；留空則用專案名稱";
  m.append(fld("PTSC 雲端分頁名稱（步驟同步用，可留空）",ptscIn));
  let autoChk=null;
  if(isNew){
    autoChk=el("input");autoChk.type="checkbox";autoChk.checked=true;autoChk.style.width="auto";autoChk.id="autoSteps";
    const lab=el("label");lab.htmlFor="autoSteps";lab.style.cssText="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600";
    lab.append(autoChk,document.createTextNode("自動套用 13 步驟標準流程（依開始～驗收日分配時程）"));
    const wrap=el("div","card");wrap.style.cssText="box-shadow:none;background:var(--tiffany-bg);padding:10px 12px;margin-top:4px";
    wrap.append(lab,el("div","gphase","取消勾選則建立空專案，之後於專案內手動新增步驟。"));
    m.append(wrap);
  }
  const bar=el("div","row");bar.style.marginTop="16px";
  const saveB=el("button","btn",isNew?"建立專案":"儲存");
  saveB.onclick=()=>{
    if(!name.value.trim()){ alert("請填寫專案名稱。"); name.focus(); return; }
    if(!getPm()){ alert("請選擇/填寫 PM（必填）。"); pmField.focus(); return; }
    const s=startD||today(), du=dueD||addDays(s,90);
    if(isNew){
      const nm=name.value.trim();
      const useSteps=autoChk?autoChk.checked:true;
      DB.projects.push({id:uid(),name:nm,customer:cust.value.trim(),pm:getPm(),ptscTab:ptscIn.value.trim(),
        startDate:s.toISOString(),dueDate:du.toISOString(),steps:useSteps?buildSteps(s,du):[],meetings:[],expenses:[],shipments:[]});
      logAction("專案",nm,"新增",`建立專案（PM：${getPm()}${useSteps?"；自動套用13步驟":"；未套用步驟範本"}）`);
    }else{
      const ch=[];
      if(p.name!==name.value.trim())ch.push(`名稱→${name.value.trim()}`);
      if((p.customer||'')!==cust.value.trim())ch.push(`客戶→${cust.value.trim()}`);
      if((p.pm||'')!==getPm())ch.push(`PM→${getPm()}`);
      if((p.startDate||'').slice(0,10)!==s.toISOString().slice(0,10))ch.push(`開始日→${s.toISOString().slice(0,10)}`);
      if((p.dueDate||'').slice(0,10)!==du.toISOString().slice(0,10))ch.push(`驗收日→${du.toISOString().slice(0,10)}`);
      if((p.ptscTab||'')!==ptscIn.value.trim())ch.push(`PTSC分頁→${ptscIn.value.trim()||'(清空)'}`);
      p.name=name.value.trim();p.customer=cust.value.trim();p.pm=getPm();p.ptscTab=ptscIn.value.trim();
      p.startDate=s.toISOString();p.dueDate=du.toISOString();
      if(ch.length) logAction("專案",p.name,"修改",`專案資料（${ch.join("、")}）`);
    }
    save();closeModal();
  };
  const cancel=el("button","btn ghost","取消");cancel.onclick=closeModal;
  bar.append(saveB,cancel);
  if(!isNew && canDeleteProject(p)){
    const del=el("button","btn","刪除專案");del.style.cssText="background:var(--red);margin-left:auto";
    del.onclick=()=>{if(confirm(`確定刪除專案「${p.name}」？此動作無法復原。`)){logAction("專案",p.name,"刪除","刪除整個專案");DB.projects=DB.projects.filter(x=>x.id!==p.id);save();closeModal();}};
    bar.append(del);
  } else if(!isNew){
    m.append(el("div","gphase","※ 僅 admin 或本專案負責 PM 可刪除此專案。"));
  }
  m.append(bar);openModal();
}

const EXP_COLOR=l=>({"設備":"#0ABAB5","人力工時":"#089c98","差旅費":"#f0a92b","材料":"#7fded9","外包/協力":"#7c6cc4","雜費":"#64748b","其他":"#9aa8b4"}[l]||"#64748b");

const netOf=a=>(+a||0)/TAX;                                   // 由含稅實付換算未稅額
function marginTag(p){
  const c=projCost(p); if(c.margin==null) return '';
  const cls=c.margin>=70?"s-green":(c.margin>=55?"s-amber":"s-red");
  return `　·　<span class="badge ${cls}" style="padding:1px 8px">毛利率 ${c.margin.toFixed(2)}%</span>`;

function projCost(p){
  const exps=p.expenses||[];
  const spentGross=exps.reduce((a,e)=>a+(+e.amount||0),0);       // 含稅實付合計
  const spentNet=exps.reduce((a,e)=>a+netOf(e.amount),0);        // 未稅支出合計
  const revenue=+p.contractAmount||0;                            // 合約收入（未稅）
  const equipBudget=+p.equipBudget||0, opexBudget=+p.opexBudget||0;
  const equipSpentNet=exps.filter(e=>EQUIP_CATS.includes(e.category)).reduce((a,e)=>a+netOf(e.amount),0);
  const opexSpentNet =exps.filter(e=>OPEX_CATS.includes(e.category)).reduce((a,e)=>a+netOf(e.amount),0);
  const equipRemain=equipBudget-equipSpentNet, opexRemain=opexBudget-opexSpentNet;
  const gross=revenue-spentNet;
  const margin=revenue>0?(gross/revenue*100):null;               // 毛利率（未稅）
  const byCatNet={};EXP_CATS.forEach(c=>byCatNet[c]=0);
  exps.forEach(e=>{byCatNet[e.category]=(byCatNet[e.category]||0)+netOf(e.amount);});
  return {spentGross,spentNet,revenue,equipBudget,opexBudget,equipSpentNet,opexSpentNet,equipRemain,opexRemain,gross,margin,byCatNet,exps};
}

function parseSheetProject(resp){

  const v=(r,c)=>{ const x=cell(r,c); return x?x.v:null; };

  if(bR>=0){ out.opexBudget=gnum(v(bR,4)); }
  const hR=grid.findIndex(row=>row&&row[0]&&String(row[0].v).trim()==="日期"&&row[3]&&String(row[3].v).trim()==="採購費用");

      const pur=gnum(v(r,3)), oth=gnum(v(r,4));

function mapStepStatus(g){ g=String(g||"").trim();

function matchPhase(a){ const t=String(a||"").replace(/^[0-9.\s]+/,"").trim();

function parseStepSheet(resp){
  const rows=(resp&&resp.table&&resp.table.rows)||[];
  const grid=rows.map(r=>(r&&r.c)||[]);
  const v=(r,c)=>{ const row=grid[r]; const x=row?row[c]:null; return x?x.v:null; };
  const cell=(r,c)=>{ const row=grid[r]; return row?row[c]:null; };
  const txt=x=>x==null?"":String(x).trim();
  let hR=grid.findIndex(row=>row && ((row[1]&&txt(row[1].v)==="執行步驟")||(row[0]&&txt(row[0].v)==="序")));
  if(hR<0) return [];

  for(let r=hR+1;r<grid.length;r++){
    const as=txt(v(r,0)), bs=txt(v(r,1));
    if(!as && !bs) continue;
    if(/階段/.test(as) && !bs){ phase=matchPhase(as); continue; }   // 若有階段分隔列
    // 只認「A 欄＝數字.數字 代碼」的列為真正步驟；頂部彙總(A空)、提示列、test 等一律略過

    const H=txt(v(r,7)), J=txt(v(r,9));                             // H 交付標準、J 異常/改善
    const hadDates=!!(txt(v(r,3)) && txt(v(r,4)));                  // 雲端 D(預計開始)+E(完成期限) 是否都已填
    steps.push({ id:uid(), src:"gsheet", _row:r+1, _hadDates:hadDates,   // _row：對應雲端列號（寫回用）
      phase:stepPhase, codeA:as, taskB:bs, name:[as,bs].filter(Boolean).join("｜"),
      owner:txt(v(r,2)),
      planStart:iso(gdate(cell(r,3))), planEnd:iso(gdate(cell(r,4))), actualStart:null, actualEnd:iso(gdate(cell(r,5))),
      status:mapStepStatus(v(r,6)), deliverStd:H, issue:J,

function applyStepSheet(p,steps){
  if(!p.steps) p.steps=[];

  steps.forEach(s=>{ if(!s.planStart)s.planStart=base.toISOString(); if(!s.planEnd)s.planEnd=s.planStart; });
  const sig=arr=>JSON.stringify((arr||[]).map(s=>[s.phase,s.name,s.owner,s.planStart,s.planEnd,s.actualEnd,s.status,s.deliverStd,s.issue]));

  const sheetSteps=[]; let lastStepRow=hR+1;
  for(let i=hR+1;i<rows.length;i++){ const A=T(rows[i]&&rows[i][0]); if(!codeRe.test(A))continue;
    sheetSteps.push({row:i+1,A,B:T(rows[i]&&rows[i][1]),hasDE:!!(T(rows[i][3])&&T(rows[i][4]))}); lastStepRow=i+1; }
  // 2) 比對：命中→更新該列；未命中→待新增
  const used=new Set(), data=[], toInsert=[];
  const put=(row,c,val)=>{ if(val!=="" && val!=null) data.push({range:`${q(tab)}!${colL(c)}${row}`, values:[[val]]}); };
  const writeRow=(row,s,hasDE)=>{ const ab=stepAB(s);
    put(row,0,ab.A); put(row,1,ab.B); put(row,5,fmtSheetDate(s.actualEnd)); put(row,7,s.deliverStd||""); put(row,9,s.issue||"");
    if(!hasDE){ put(row,3,fmtSheetDate(s.planStart)); put(row,4,fmtSheetDate(s.planEnd)); } };  // 雲端 D/E 原本空才寫；不寫 C(負責人)、G(狀態)
  for(const s of p.steps){ const ab=stepAB(s);
    const hit=sheetSteps.find(ss=>!used.has(ss.row) && ss.A===ab.A && ss.B===ab.B);
    if(hit){ used.add(hit.row); writeRow(hit.row,s,hit.hasDE); }
    else toInsert.push(s); }
  // 3) 更新既有列
  if(data.length) await sheetsFetchJson(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values:batchUpdate`,token,
    {method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({valueInputOption:"USER_ENTERED",data})});
  // 4) 新增步驟：在步驟表最後一列之後插入 N 列，再寫入（需要 gid）
  let appended=0;
  if(toInsert.length){
    const meta=await sheetsFetchJson(`https://sheets.googleapis.com/v4/spreadsheets/${sid}?fields=sheets.properties(sheetId,title)`,token);
    const sp=(meta.sheets||[]).find(x=>x.properties&&x.properties.title===tab);
    if(!sp) throw new Error("找不到分頁「"+tab+"」的 gid");
    const gid=sp.properties.sheetId, N=toInsert.length;
    await sheetsFetchJson(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,token,
      {method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
       body:JSON.stringify({requests:[{insertDimension:{range:{sheetId:gid,dimension:"ROWS",startIndex:lastStepRow,endIndex:lastStepRow+N},inheritFromBefore:true}}]})});
    const data2=[];
    toInsert.forEach((s,k)=>{ const row=lastStepRow+1+k, ab=stepAB(s);
      const pv=(c,val)=>{ if(val!=="" && val!=null) data2.push({range:`${q(tab)}!${colL(c)}${row}`, values:[[val]]}); };
      pv(0,ab.A);pv(1,ab.B);pv(3,fmtSheetDate(s.planStart));pv(4,fmtSheetDate(s.planEnd));pv(5,fmtSheetDate(s.actualEnd));pv(7,s.deliverStd||"");pv(9,s.issue||""); });
    if(data2.length) await sheetsFetchJson(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values:batchUpdate`,token,
      {method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({valueInputOption:"USER_ENTERED",data:data2})});
    appended=N;
  }
  return { updated:data.length, appended };
}

function monthKey(d){const x=new Date(d);return x.getFullYear()+"/"+String(x.getMonth()+1).padStart(2,'0');}
function ticketStats(){
  const ts=DB.tickets;
  const open=ts.filter(t=>t.status!=="已結案");
  const closed=ts.filter(t=>t.status==="已結案");
  const overdue=open.filter(ticketOverdue).length;
  // MTTR（平均處理天數）
  let mttr="—";
  const durs=closed.filter(t=>t.closedAt).map(t=>Math.max(0,dayDiff(t.closedAt,t.reportedAt)));
  if(durs.length)mttr=(durs.reduce((a,b)=>a+b,0)/durs.length).toFixed(1);
  // SLA 達成率（結案時間 <= SLA 期限）
  let slaRate="—";
  const rated=closed.filter(t=>t.closedAt);
  if(rated.length){const ok=rated.filter(t=>new Date(t.closedAt)<=ticketDue(t)).length;
    slaRate=Math.round(ok/rated.length*100)+"%";}
  const by=(key,val)=>{const m={};ts.forEach(t=>{const k=val?val(t):t[key];m[k]=(m[k]||0)+1;});return m;};
  // 近 6 個月趨勢
  const months=[];const now=today();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(monthKey(d));}
  const trend={};months.forEach(m=>trend[m]=0);
  ts.forEach(t=>{const k=monthKey(t.reportedAt);if(k in trend)trend[k]++;});
  return {total:ts.length,open:open.length,overdue,mttr,slaRate,
    status:by("status"),severity:by("severity"),category:by("category"),months,trend};
}
function hbars(title, entries, colorOf){
  const card=el("div","chartcard");card.append(el("h4",null,title));
  const max=Math.max(1,...entries.map(e=>e[1]));
  if(entries.every(e=>e[1]===0)) card.append(el("div","gphase","尚無資料"));
  entries.forEach(([label,val])=>{
    const row=el("div","hbar");
    row.innerHTML=`<div>${label}</div><div class="track"><div class="fill" style="width:${val/max*100}%;background:${colorOf(label)}"></div></div><div class="v">${Math.round(val).toLocaleString("en-US")}</div>`;
    card.append(row);
  });
  return card;
}
function colChart(title, labels, values){
  const card=el("div","chartcard");card.append(el("h4",null,title));

    box.append(w);
  });
  card.append(box);return card;
}

    <div class="f2"><div class="field"><label>關聯專案</label>${p?p.name+'（'+p.customer+'）':'<span class="badge s-grey" style="padding:1px 8px">NA（不關聯）</span>'}</div>
    <div class="field"><label>設備 / 點位</label>${t.device||'—'}</div></div>
    <div class="f2"><div class="field"><label>分類</label>${t.category}</div>
    <div class="field"><label>處理人</label>${t.assignee||'—'}</div></div>`;
  m.append(body);
  const hf=el("div","field");hf.innerHTML=`<label>處理方式 / 進度記錄</label>`;
  const ta=el("textarea");ta.rows=4;ta.value=t.handling||"";ta.oninput=()=>{t.handling=ta.value;save();};
  ta.onchange=()=>{logAction("報修",t.no,"修改","更新處理方式 / 進度記錄");};
  hf.append(ta);m.append(hf);
  // 狀態流
  const sf=el("div","field");sf.innerHTML=`<label>狀態流程</label>`;
  const row=el("div","row");
  TICKET_STATUS.forEach(s=>{
    const b=el("button",(t.status===s?"btn mini":"btn ghost mini"),s);
    b.onclick=()=>{if(t.status!==s)logAction("報修",t.no,"修改",`狀態→${s}`);t.status=s;if(s==="已結案")t.closedAt=today().toISOString();else t.closedAt=null;save();drawTicket(t);renderTickIfActive();};
    row.append(b);
  });
  sf.append(row);m.append(sf);
  if(t.status==="已結案")m.append(el("div","badge s-tiff",`已結案　·　${fmt(t.closedAt)}　·　處理時長 ${Math.max(0,dayDiff(t.closedAt,t.reportedAt))} 天`));
  // 編輯 / 刪除
  const bar=el("div","row");bar.style.marginTop="16px";
  if(canEdit()){const eb=el("button","btn ghost mini","✎ 編輯欄位");eb.onclick=()=>openTicketForm(t);bar.append(eb);}
  if(canDelete()){const db=el("button","btn ghost mini","🗑 刪除此工單");db.style.color="#a8331f";
    db.onclick=()=>{if(confirm(`確定刪除報修單「${t.no}」？`)){logAction("報修",t.no,"刪除",`刪除報修單「${t.title}」`);DB.tickets=DB.tickets.filter(x=>x.id!==t.id);save();closeModal();}};bar.append(db);}
  m.append(bar);
}
function renderTickIfActive(){ if(TAB==="tick")renderTick(); }
function openTicketForm(t){        // t 為 null=新增，否則=編輯
  const isNew=!t;
  const m=$("#modalBox");m.innerHTML="";
  m.append(el("button","x","×"));m.querySelector(".x").onclick=closeModal;
  m.append(el("h3",null,isNew?"新增報修":"編輯報修 "+t.no));
  const title=el("input");title.value=t?.title||"";
  const projSel=el("select");
  const na=el("option",null,"NA（不關聯，已結案案件）");na.value="__NA__";projSel.append(na);
  DB.projects.forEach(pp=>{const o=el("option",null,`${pp.name}（${pp.customer}）`);o.value=pp.id;if(t&&t.projectId===pp.id)o.selected=true;projSel.append(o);});
  if(t&&!t.projectId) na.selected=true;
  const device=el("input");device.value=t?.device||"";
  const catSel=el("select");CATEGORY.forEach(c=>{const o=el("option",null,c);if(t?t.category===c:c==="硬體/感測器")o.selected=true;catSel.append(o);});
  const sevSel=el("select");["緊急","高","一般","低"].forEach(sv=>{const o=el("option",null,sv);if(t?t.severity===sv:sv==="一般")o.selected=true;sevSel.append(o);});
  const src=el("input");src.value=t?.source||"";src.placeholder="電話 / LINE / Email / 系統告警";
  const asg=el("input");asg.value=t?.assignee||"";asg.placeholder="處理人";
  const warSel=el("select");[["true","保固內"],["false","否（付費）"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;if(t?String(!!t.warranty)===v:v==="true")o.selected=true;warSel.append(o);});
  m.append(fld("報修主旨 *",title));
  const r1=el("div","f2");r1.append(fld("關聯專案",projSel),fld("設備 / 點位",device));m.append(r1);
  const r2=el("div","f3");r2.append(fld("分類",catSel),fld("分級（SLA）",sevSel),fld("保固",warSel));m.append(r2);
  const r3=el("div","f2");r3.append(fld("來源",src),fld("處理人",asg));m.append(r3);
  const bar=el("div","row");bar.style.marginTop="16px";
  const saveB=el("button","btn",isNew?"建立報修":"儲存");
  saveB.onclick=()=>{
    if(!title.value.trim()){title.focus();return;}
    const projectId=projSel.value==="__NA__"?null:projSel.value;
    if(isNew){
      const tno=genTicketNo(ymd(today()));
      DB.tickets.push({id:uid(),no:tno,title:title.value.trim(),projectId,
        device:device.value.trim(),category:catSel.value,severity:sevSel.value,source:src.value.trim()||"電話",
        reportedAt:today().toISOString(),status:"新建",assignee:asg.value.trim(),handling:"",closedAt:null,warranty:warSel.value==="true"});
      logAction("報修",tno,"新增",`建立報修單「${title.value.trim()}」`);
    }else{
      t.title=title.value.trim();t.projectId=projectId;t.device=device.value.trim();t.category=catSel.value;
      t.severity=sevSel.value;t.source=src.value.trim()||"電話";t.assignee=asg.value.trim();t.warranty=warSel.value==="true";
      logAction("報修",t.no,"修改",`編輯報修單欄位（主旨：${t.title}）`);
    }
    save();closeModal();
  };
  const cancel=el("button","btn ghost","取消");cancel.onclick=closeModal;
  bar.append(saveB,cancel);
  if(!isNew && canDelete()){
    const del=el("button","btn","刪除");del.style.cssText="background:var(--red);margin-left:auto";
    del.onclick=()=>{if(confirm(`確定刪除報修單「${t.no}」？`)){logAction("報修",t.no,"刪除",`刪除報修單「${t.title}」`);DB.tickets=DB.tickets.filter(x=>x.id!==t.id);save();closeModal();}};
    bar.append(del);
  }
  m.append(bar);openModal();
}

/* ============ 資料 / 匯出 ============ */
function renderData(){
  const app=$("#app");app.innerHTML="";
  app.append(el("h2",null,"資料 / 設定"));
  const modeTxt = cloud.on ? `雲端多人模式（已連線，登入為 ${ME.name}／${ME.role}）` : "本機試用模式（未連雲端）";
  app.append(el("div","page-sub",modeTxt));
  // 雲端連線狀態
  const cc=el("div","card");
  cc.innerHTML=`<div class="row between"><b>雲端連線</b>
    <span class="cloudtag ${cloud.on?'on':'off'}">${cloud.on?'● 已連線':'○ 未連線'}</span></div>
    <div class="gphase" style="margin-top:8px;line-height:1.8">
    ${cloud.on
      ? '資料儲存在你們的 Supabase，3-10 人可即時共用。變更會自動同步，其他人畫面約 1 秒內更新。'
      : '目前為單機。要開啟多人共用，請點下方「設定雲端連線」貼上 Supabase 資訊（建置指引另附）。'}</div>`;
  const cbtn=el("button","btn","☁ 設定雲端連線 / 登入");cbtn.style.marginTop="10px";
  cbtn.onclick=()=>screenConfig();
  cc.append(cbtn);
  if(cloud.on){ const lo=el("button","btn ghost","登出");lo.style.marginLeft="8px";
    lo.onclick=async()=>{await cloud.sb.auth.signOut();location.reload();}; cc.append(lo); }
  app.append(cc);
  // Google 試算表同步（成本/毛利）—— 僅 admin/PM 可見
  if(costVisible()){
    const gs=el("div","card");
    gs.innerHTML=`<div class="row between"><b>Google 試算表同步（成本 / 毛利）</b></div>
      <div class="gphase" style="margin-top:8px;line-height:1.8">以「分頁名稱＝專案名稱」對應，唯讀抓取合約金額、採購預算、其他費用與支出明細；<b>不會改動你的試算表</b>。開啟任一專案的「成本/毛利」頁時會自動同步該專案；下方可一次同步全部。試算表需設為「知道連結者可檢視」。</div>`;
    const idLab=el("label",null,"試算表 ID（網址 /d/ 與 /edit 之間那段）");idLab.style.marginTop="10px";
    const idIn=el("input");idIn.value=getSheetId();idIn.style.width="100%";idIn.placeholder="例：1V3Q3W9EiLDdt7BAnK4Pq91NIF1cPWo3oeP85ckrzBQo";
    idIn.onchange=()=>{ setSheetId(idIn.value); };
    const sbtn=el("button","btn","⟳ 立即同步全部專案");sbtn.style.marginTop="12px";
    const st=el("div","gphase");st.style.marginTop="8px";
    sbtn.onclick=async()=>{ setSheetId(idIn.value); sbtn.disabled=true; sbtn.textContent="同步中…"; await syncAllFromSheet(st); sbtn.disabled=false; sbtn.textContent="⟳ 立即同步全部專案"; };
    gs.append(idLab,idIn,sbtn,st);
    // PTSC 步驟表 ID
    const pLab=el("label",null,"PTSC 步驟表 ID（唯讀同步步驟用）");pLab.style.marginTop="16px";
    const pIn=el("input");pIn.value=getStepSheetId();pIn.style.width="100%";pIn.placeholder="例：1WZSHmqYrGUhzzHileYSZWfnqO86VgZSuxplrd7P0xKU";
    pIn.onchange=()=>{ setStepSheetId(pIn.value); };
    gs.append(pLab,pIn,el("div","gphase",'開啟任一專案的「步驟 / 交付」頁時，會自動從 PTSC 雲端表更新步驟（階段／步驟／負責人／交付H／異常J／時程／狀態），手動改的步驟保留；對應分頁由各專案的「PTSC 雲端分頁名稱」決定（留空則用專案名稱）。此表同樣需設為「知道連結者可檢視」。'));
    // 回寫用 OAuth 用戶端 ID（每人用自己的 Google 帳號寫回）
    const oLab=el("label",null,"回寫用 Google OAuth 用戶端 ID（步驟回寫 PTSC 用）");oLab.style.marginTop="16px";
    const oIn=el("input");oIn.value=getOAuthClientId();oIn.style.width="100%";oIn.placeholder="例：xxxxxxxx.apps.googleusercontent.com";
    oIn.onchange=()=>{ setOAuthClientId(oIn.value); };
    gs.append(oLab,oIn,el("div","gphase",'回寫（系統→雲端）在各專案「步驟/交付」頁按「⤴ 回寫 PTSC」，會跳出 Google 授權、以你自己的帳號寫入（雲端編輯者顯示為你本人）。需：1) 在 Google Cloud 建立 OAuth 用戶端 ID（網頁應用程式），把你的網站網址加入「已授權的 JavaScript 來源」；2) 開啟 Sheets API；3) 把用戶端 ID 貼在此。回寫只在 https 網站（如 GitHub Pages）可用，本機檔案不支援。建議先用複製的分頁測試。'));
    app.append(gs);
  }
  const c=el("div","card");
  const exp=el("button","btn","⬇ 匯出備份 (JSON)");exp.onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="WCRM_PM備份_"+new Date().toISOString().slice(0,10)+".json";a.click();};
  const impL=el("label",null,"匯入備份：");impL.style.marginTop="14px";
  const imp=el("input");imp.type="file";imp.accept=".json";
  imp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{DB=JSON.parse(r.result);logAction("系統","全部資料","修改","匯入 JSON 覆蓋全部資料");save();alert("匯入成功");render();}catch(err){alert("檔案格式錯誤");}};r.readAsText(f);};
  c.append(exp,el("div",null,"<br>"),impL,imp);
  if(!cloud.on){   // 只在單機試玩模式顯示；雲端正式環境隱藏，避免誤清共用資料
    const rst=el("button","btn ghost","↺ 重置為範例資料");rst.style.marginTop="12px";
    rst.onclick=()=>{if(confirm("確定重置？現有資料會清除")){logAction("系統","全部資料","刪除","重置為範例資料");DB=seed();save();render();}};
    c.append(el("div",null,"<br>"),rst);
  }
  app.append(c);
}

/* ============ Modal ============ */
function openModal(){$("#modalBg").classList.add("on");}
function closeModal(){$("#modalBg").classList.remove("on");render();}
$("#modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal();};

boot();
</script>
